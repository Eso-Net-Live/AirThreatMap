<style>
:root{
  color-scheme:dark;
  --bg:#111820;
  --panel:#18232e;
  --panel2:#202d3a;
  --line:rgba(202,220,235,.13);
  --text:#edf4fa;
  --muted:#9eafbd;
  --accent:#4da3ff;
  --danger:#ff4d5e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#0b1117;color:var(--text)}
#map{position:absolute;inset:0;width:100%;height:100%;background:#101820}
.leaflet-container{font:14px/1.45 Inter,system-ui,sans-serif;background:#101820}
.leaflet-control-zoom{border:1px solid var(--line)!important;border-radius:10px!important;overflow:hidden;box-shadow:0 5px 20px #0005!important}
.leaflet-control-zoom a{background:#18232e!important;color:#edf4fa!important;border-color:var(--line)!important}
.leaflet-control-zoom a:hover{background:#263747!important}
.leaflet-control-attribution{background:#101820d9!important;color:#9eafbd!important;border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:#8fc5ff!important}
#panel{
 position:absolute;z-index:1000;top:16px;left:16px;width:340px;max-width:calc(100vw - 32px);
 max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;
 background:rgba(19,29,39,.96);color:var(--text);border:1px solid var(--line);
 border-radius:16px;padding:18px;box-shadow:0 14px 42px #0007;backdrop-filter:blur(16px);
 transition:transform .24s ease,opacity .24s ease;
 scrollbar-width:thin;scrollbar-color:#3a4c5b transparent
}
#panel h2{font-size:17px;line-height:1.35;font-weight:750;letter-spacing:-.25px;margin:0 38px 16px 0;padding-bottom:14px;border-bottom:1px solid var(--line)}
#categories{display:flex;flex-direction:column;gap:5px}
.category{display:flex;align-items:center;gap:10px;padding:11px 10px;border:1px solid transparent;border-radius:10px;cursor:pointer;user-select:none;transition:background .15s,border-color .15s}
.category:hover{background:#ffffff0a;border-color:#ffffff0c}
.category:has(input:checked){background:#4da3ff12;border-color:#4da3ff25}
.category input{appearance:none;flex:0 0 18px;width:18px;height:18px;margin:0;border:1.5px solid #718392;border-radius:5px;background:#111a23;cursor:pointer;display:grid;place-items:center}
.category input:checked{background:var(--accent);border-color:var(--accent)}
.category input:checked:after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);margin-top:-2px}
.category-name{flex:1;font-size:13px;font-weight:600;color:#dce7ef;line-height:1.35}
.category-disabled{opacity:.48;cursor:not-allowed;filter:saturate(.55)}
.category-disabled input{cursor:not-allowed}
.category-count{min-width:28px;padding:4px 7px;border-radius:7px;background:#2a3947;color:#d8e6f1;font-size:11px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums}
#status{margin-top:14px;padding:12px 12px;border:1px solid var(--line);border-radius:10px;background:#0f1821;color:var(--muted);font-size:11px;line-height:1.55}
#alertBadge{margin-top:10px;padding:10px;border-radius:10px;background:#ff4d5e20;border:1px solid #ff4d5e80;color:#ff8994;font-weight:750;font-size:12px;text-align:center;animation:alertPulse 3s infinite}
@keyframes alertPulse{50%{opacity:.58}}
#panelToggle{position:absolute;z-index:1100;top:16px;left:16px;width:46px;height:46px;border:1px solid var(--line);border-radius:13px;background:#17232f;color:white;font-size:22px;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px #0006;backdrop-filter:blur(12px)}
#panelToggle:hover{background:#263747}
#panelToggle:active{transform:scale(.96)}
#panelClose{display:none;position:absolute;top:12px;right:12px;width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:#ffffff08;color:#dce7ef;font-size:17px;cursor:pointer}
#panelClose:hover{background:#ffffff15}
#neptunAttribution{position:absolute;z-index:1001;right:12px;bottom:12px;background:rgba(17,26,35,.9);color:#b6c7d5;border:1px solid var(--line);padding:7px 10px;border-radius:9px;font-size:11px;box-shadow:0 4px 14px #0004;backdrop-filter:blur(10px)}
#neptunAttribution a{color:#a8d2ff;text-decoration:none}
#neptunAttribution a:hover{text-decoration:underline}
.emoji-marker{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#111820eF;border:2px solid white;font-size:19px;box-shadow:0 3px 12px #0009}
.neptun-threat-marker,.mapa-threat-marker{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#f59e0bdc;border:2px solid #fff;box-shadow:0 0 14px #f59e0b99,0 3px 12px #0008;font-size:21px}
.neptun-threat-marker.redLevel,.mapa-threat-marker.redLevel{background:#ef3340ed;box-shadow:0 0 22px #ef3340b8,0 3px 12px #0008}
.neptun-alert-pulse{animation:neptunPulse 1.2s infinite}
@keyframes neptunPulse{50%{filter:brightness(1.5);box-shadow:0 0 24px #f33,0 3px 10px #0008}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#18232e;color:#edf4fa;box-shadow:0 8px 28px #0007}
.leaflet-popup-content-wrapper{border:1px solid #ffffff1a;border-radius:12px}
.leaflet-popup-content{font-size:14px!important;line-height:1.5!important;margin:14px 16px!important;max-width:min(340px,75vw)}
.leaflet-popup-content b,.leaflet-popup-content strong{font-size:15px!important}
.leaflet-popup-content a{font-size:13px!important;color:#8fc5ff!important}
.leaflet-popup-close-button{color:#c7d5e0!important}


/* Premium UAV information card */
.leaflet-popup-content-wrapper.uav-popup-shell{padding:0;overflow:hidden;background:#101923;border:1px solid #34495b;border-radius:18px;box-shadow:0 18px 48px #0009;color:#edf6ff}
.leaflet-popup-content.uav-popup-content{width:min(340px,calc(100vw - 76px))!important;max-width:calc(100vw - 76px)!important;margin:0!important;font-size:14px!important;line-height:1.5!important}
.uav-card{overflow:hidden;border-radius:17px;background:linear-gradient(160deg,#182737 0%,#101923 70%)}
.uav-card__head{display:flex;align-items:center;gap:12px;padding:16px 16px 14px;background:linear-gradient(120deg,#203b50,#182638);border-bottom:1px solid #ffffff12}
.uav-card__symbol{display:grid;place-items:center;flex:0 0 48px;width:48px;height:48px;border:1px solid #ffbd5966;border-radius:15px;background:linear-gradient(145deg,#ffb84d2b,#ff8b2020);font-size:25px;box-shadow:inset 0 1px #ffffff16}
.uav-card__eyebrow{font-size:10px;letter-spacing:1.35px;text-transform:uppercase;font-weight:800;color:#a9c4d8}
.uav-card__title{margin-top:3px;font-size:17px;font-weight:800;line-height:1.25;color:#f6fbff;overflow-wrap:anywhere}
.uav-card__body{padding:14px 16px 15px}
.uav-card__badge{display:inline-flex;align-items:center;gap:7px;margin-bottom:13px;padding:6px 9px;border:1px solid #f5ad4d55;border-radius:999px;background:#f5ad4d15;color:#ffd08b;font-size:11px;font-weight:750}
.uav-card__dot{width:7px;height:7px;border-radius:50%;background:#ffbd59;box-shadow:0 0 9px #ffbd5980}
.uav-card__grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.uav-card__metric{min-width:0;padding:10px 11px;border:1px solid #ffffff12;border-radius:12px;background:#ffffff06}
.uav-card__label{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:#93a9ba;font-weight:750}
.uav-card__value{margin-top:4px;font-size:14px;font-weight:750;color:#f0f7fd;overflow-wrap:anywhere}
.uav-card__description{margin-top:12px;padding:11px 12px;border-left:3px solid #70b9ef;border-radius:0 10px 10px 0;background:#6cb8f010;color:#d5e3ed;font-size:12px;overflow-wrap:anywhere}
.uav-card__advisory{margin:0 0 12px;padding:9px 10px;border:1px solid #f5ad4d55;border-radius:10px;background:#f5ad4d12;color:#ffd08b;font-size:12px;font-weight:700}
.uav-card__foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 16px;border-top:1px solid #ffffff12;color:#8298a9;font-size:10px}
.uav-card__source{color:#a8d7ff!important;font-size:11px!important;font-weight:800;text-decoration:none}
.uav-card__source:hover{text-decoration:underline}
.leaflet-popup-content-wrapper:has(.uav-card){padding:0}
.leaflet-popup-content:has(.uav-card){margin:0!important}
.leaflet-popup-tip{background:#101923!important}
@media(max-width:480px){.uav-card__head{padding:13px}.uav-card__body{padding:12px}.uav-card__foot{padding:10px 12px}.uav-card__title{font-size:16px}}

/* Alert history dialog */
.mapHistory{width:min(680px,calc(100vw - 28px));max-width:none;max-height:min(88vh,760px);padding:0;border:1px solid #ffffff24;border-radius:14px;background:#282d33;color:#edf0f4;box-shadow:0 24px 80px #000a;overflow:hidden}
.mapHistory::backdrop{background:#070b10b8;backdrop-filter:blur(3px)}
.mapHistory__head{display:flex;justify-content:space-between;align-items:center;padding:24px 28px 18px;border-bottom:1px solid #ffffff20}
.mapHistory__head span{font-size:12px;color:#aab3bd;font-weight:700}
.mapHistory__head h2{margin:5px 0 0;font-size:25px;line-height:1.2}
.mapHistory__close{width:44px;height:44px;border:1px solid #ffffff24;border-radius:50%;background:transparent;color:#f4f6f8;font-size:28px;cursor:pointer}
.mapHistory__body{padding:18px 28px 24px;overflow:auto;max-height:calc(88vh - 100px);overscroll-behavior:contain}
.mapHistory__day h3{font-size:12px;color:#aab3bd;border-bottom:1px solid #ffffff20;padding-bottom:10px;margin:10px 0 14px}
.mapHistoryCard{padding:16px 17px;margin:0 0 10px;border:1px solid #ffffff20;border-radius:10px;background:#282d33}
.mapHistoryCard.is-yellow{background:#4b4229;border-color:#a18b46}
.mapHistoryCard.is-red{background:#482b32;border-color:#b83b4b}
.mapHistoryCard.is-neutral{background:#28323b;border-color:#566575}
.mapHistoryCard.is-custom{background:#292f35;border-color:var(--custom-threat-color,#566575)}
.mapHistoryCard__customText strong{font-size:17px;line-height:1.3;color:#f5f7fa}
.mapHistoryCard__customText .mapHistoryCard__region{font-size:11px;line-height:1.35}
.mapHistoryCard__customText .custom-threat-name{font-size:12px;line-height:1.4;color:#c6d0d9;font-weight:600;margin-top:2px}
.mapHistoryCard.is-custom .mapHistoryCard__bottom{font-size:12px;color:#c6d0d9;margin-top:10px}
.mapHistoryCard__reason{font-size:12px;color:#d0d9e1;margin-top:8px;line-height:1.45}
.mapHistoryCard__icon{width:28px;height:28px;object-fit:contain;flex:none}
.mapHistoryCard__customIcon{align-self:flex-start;margin-top:2px}
.mapHistoryCard__top,.mapHistoryCard__bottom,.mapHistoryCard__identity{display:flex;align-items:center;gap:10px}
.mapHistoryCard__top,.mapHistoryCard__bottom{justify-content:space-between}
.mapHistoryCard__identity img{width:28px;height:28px;flex:none}
.mapHistoryCard__identity>div{display:flex;flex-direction:column;gap:3px}
.mapHistoryCard__identity strong{font-size:14px}
.mapHistoryCard__level{font-size:12px;color:#f2c94c;font-weight:700}
.mapHistoryCard__level.red{color:#f18d85}
.mapHistoryCard__region,.mapHistoryCard__duration{font-size:12px;color:#aab3bd;font-weight:600}
.mapHistoryCard__ongoing{font-size:11px;border:1px solid #a18b46;border-radius:4px;padding:4px 7px;color:#f2c94c}
.mapHistoryCard__bottom{border-top:1px solid #ffffff20;padding-top:12px;margin-top:12px;font-size:14px;font-weight:700}
.mapHistory__empty{padding:18px;border:1px dashed #ffffff30;border-radius:10px;color:#bac4ce;line-height:1.5}
.history-hint{font-size:11px;color:#aab3bd;margin:14px 0 0;line-height:1.5}
.leaflet-interactive.area-history-hit{cursor:pointer}
@media(max-width:600px){.mapHistory__head{padding:18px}.mapHistory__head h2{font-size:21px}.mapHistory__body{padding:14px 16px 18px}.mapHistoryCard{padding:13px}.mapHistoryCard__bottom{font-size:13px}}

@media(max-width:600px){
 #panelToggle{display:flex}
 #panel{top:10px;left:10px;width:310px;max-width:calc(100vw - 20px);max-height:calc(100vh - 20px);transform:translateX(calc(-100% - 20px));opacity:0;pointer-events:none;padding:48px 14px 14px;border-radius:14px}
 #panel.panel-open{transform:translateX(0);opacity:1;pointer-events:auto}
 #panelClose{display:block}
 #panel h2{font-size:15px;margin-bottom:12px}
 .category{padding:10px 8px}
 .category-name{font-size:12px}
 #neptunAttribution{right:6px;bottom:6px;font-size:10px;padding:5px 7px}
 .leaflet-popup-content{max-width:calc(100vw - 90px);font-size:13px!important}
}
@media(max-width:380px){
 #panel{width:280px}
 #panelToggle{width:42px;height:42px}
}
</style>

<!-- =========================

    id="panelClose"

  </button>

  <div id="alertBadge">

  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- NEPTUN SDK -->
<script src="https://neptun.in.ua/sdk/neptun.js"></script>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */
// Не буде, поки що
/* =========================================================
   NEPTUN
========================================================= */

const NEPTUN_URL =
  "https://neptun.in.ua";
const NAHR_URL = 
  "https://radar.nahr.uk/";


const NEPTUN_ALERTS_URL =
  NEPTUN_URL + "/api/v1/alerts";


const NEPTUN_THREATS_URL =
  NEPTUN_URL + "/api/v1/threats";

const MAPA_THREATS_URL =
  "https://mapa.ua/api/v1/current";

function getMapaThreatsURL() {
  return MAPA_THREATS_URL + "?t=" + Date.now();
}


const NAHR_THREATS_URL = 
  NAHR_URL + "api/alerts?et=1789153733-yveXuMVeU6fjv1EfFNowVYVTqmT2JumGutWY4XqOW8M";
  
const NEPTUN_CATEGORY_ALERT = "1";
const NEPTUN_CATEGORY_UAV = "2";
const MAPA_CATEGORY_THREAT = "3";

/*
 * NEPTUN API не отдаёт нам готовые границы через указанные
 * endpoints GeoJSON, поэтому используем публичные GeoJSON
 * административных границ Украины.
 */

// Актуальні межі з OSM administrative boundaries (GeoJSON).
// Ukraine.geojson містить межі областей; окремі файли областей — їхні райони.
const GEOJSON_BASE_URL =
  "https://cdn.jsdelivr.net/gh/darmat1/ukraine-geo-data@main/geodata";
const OBLASTS_GEOJSON_URL = GEOJSON_BASE_URL + "/Ukraine.geojson";
const OBLAST_GEOJSON_RU_URL = "https://raw.githubusercontent.com/datasets/geo-boundaries-world-1/master/countries/RUS.geojson"
/* =========================================================
   КАТЕГОРІЇ
========================================================= */

const categories = {

  "1": {
    name: "🚨 Повітряна тривога",
    emoji: "🚨",
    radius: 3000,
    color: "#ff0000",
    minZoom: 0,
    show: true
  },

  "2": {
    name: "✈️ БПЛА",
    emoji: "✈️",
    radius: 2500,
    color: "#ff9900",
    minZoom: 0,
    show: true
  },
  "3": {
    name: "🛩️ БПЛА (Розширений режим)",
    emoji: "🛩️",
    radius: 2500,
    color: "#ff9900",
    minZoom: 0,
    show: false
  },

};

/* =========================================================
   MAP
========================================================= */

const UKRAINE_VIEW_BOUNDS = L.latLngBounds([[44.0, 21.0], [53.0, 41.0]]);

const map =
  L.map("map", {
    zoomControl: true,
    maxBounds: UKRAINE_VIEW_BOUNDS,
    maxBoundsViscosity: 0.92,
    minZoom: 6
  }).setView([48.38, 31.17], 6);

/* =========================================================
   TILE
========================================================= */

// Темна картографічна підкладка CARTO.
const CARTO_BASEMAP_KEY = "cb1_4p71_1_bc1eb1f9cdb46f6143101482";
const CARTO_DARK_TILES = "https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=" + CARTO_BASEMAP_KEY;

L.tileLayer(CARTO_DARK_TILES, {
  subdomains: "abcd",
  maxZoom: 20,
  attribution: "© OpenStreetMap contributors © CARTO"
}).addTo(map);

/* =========================================================
   МАСКА: ПОЗА МЕЖАМИ УКРАЇНИ — ТЕМНЕ ПОЛЕ
========================================================= */
// Перевіряємо ISO-код та назви країни, щоб не затемнити Крим окремо від України.
const WORLD_COUNTRIES_GEOJSON_URL = "https://cdn.jsdelivr.net/gh/datasets/geo-countries@main/data/countries.geojson";
const ukraineOutlineLayer = L.layerGroup().addTo(map);

fetch(WORLD_COUNTRIES_GEOJSON_URL)
  .then(response => {
    if (!response.ok) throw new Error("Не вдалося завантажити межі країн");
    return response.json();
  })
  .then(data => {
    const features = Array.isArray(data.features) ? data.features : [];
    const isUkraineFeature = feature => {
      const props = feature && feature.properties ? feature.properties : {};
      const iso = String(props["ISO3166-1-Alpha-3"] || props.ISO_A3 || props.iso_a3 || props.ADM0_A3 || "").trim().toUpperCase();
      const name = String(props.name || props.NAME || props.ADMIN || props.admin || props.NAME_EN || "").trim().toLowerCase();
      return iso === "UKR" || ["ukraine", "україна", "украина"].includes(name);
    };
    const ukraineFeature = features.find(isUkraineFeature);
    const isRussiaFeature = feature => {
      const props = feature && feature.properties ? feature.properties : {};
      const iso = String(props["ISO3166-1-Alpha-3"] || props.ISO_A3 || props.iso_a3 || props.ADM0_A3 || "").trim().toUpperCase();
      const name = String(props.name || props.NAME || props.ADMIN || props.admin || props.NAME_EN || "").trim().toLowerCase();
      return iso === "RUS" || ["russia", "russian federation", "росія", "россия"].includes(name);
    };

    // У деяких світових наборах Крим помилково входить до геометрії Росії.
    // Якщо він окремим полігоном у MultiPolygon, прибираємо саме цей полігон з маски.
    const otherCountries = features
      .filter(feature => !isUkraineFeature(feature))
      .map(feature => {
        if (!isRussiaFeature(feature) || !feature.geometry) return feature;
        const geometry = feature.geometry;
        const isCrimeaPolygon = ringSet => {
          const ring = Array.isArray(ringSet) && Array.isArray(ringSet[0]) ? ringSet[0] : ringSet;
          if (!Array.isArray(ring) || !ring.length) return false;
          const xs = ring.map(point => point[0]).filter(Number.isFinite);
          const ys = ring.map(point => point[1]).filter(Number.isFinite);
          if (!xs.length || !ys.length) return false;
          const minX = Math.min(...xs), maxX = Math.max(...xs);
          const minY = Math.min(...ys), maxY = Math.max(...ys);
          // Кримський півострів: полігон має повністю вкладатися в цей географічний діапазон.
          return minX >= 32.0 && maxX <= 37.2 && minY >= 43.8 && maxY <= 47.0;
        };
        if (geometry.type === "MultiPolygon" && Array.isArray(geometry.coordinates)) {
          const coordinates = geometry.coordinates.filter(poly => !isCrimeaPolygon(poly));
          return { ...feature, geometry: { ...geometry, coordinates } };
        }
        if (geometry.type === "Polygon" && isCrimeaPolygon(geometry.coordinates)) {
          return null;
        }
        return feature;

function createCategoryPanel() {

  Object.entries(categories).forEach(
    ([id, category]) => {

      const row =
        document.createElement(
          "label"
        );

      row.className =
        "category";

      const checkbox =
        document.createElement(
          "input"
        );

      checkbox.type =
        "checkbox";

      // Категорія 3 зарезервована для розширеного режиму й вимкнена.

      if (id === "3") {
        row.classList.add("category-disabled");

          updateVisibility();

      );

      name.className =
        "category-name";

      name.textContent =

        document.createElement(
          "span"
        );

      count.className =
        "category-count";

      count.id =

      count.textContent =
        "0";

      row.appendChild(
        checkbox

      row.appendChild(
        name

      row.appendChild(
        count
      );

      container.appendChild(

  );

function createNeptunThreatIcon(
  type,
  rotate = 0
) {

  const normalizedType =
    normalizeType(type);

  let iconFile = "all.png";
  let shouldRotate = true;

  if (normalizedType === "fpv") {
    iconFile = "fpv.png";
    // FPV marker is always shown without rotation.
    shouldRotate = false;
  }
  else if (normalizedType === "recon") {
    iconFile = "recon.png";
  }
  else if (normalizedType === "uav") {
    iconFile = "uav.png";
  }

  const rotation =
    shouldRotate && rotate != null
      ? rotate
      : 0;

  return L.divIcon({

    className: normalizedType === "all" ?"neptun-threat-icon red": "neptun-threat-icon",

    html: `\n      <div
        class="neptun-threat-marker${iconFile === "all.png" ?" redLevel":
        ""}"
        style="transform: rotate(${rotation}deg);"
      >
        <img
          src="./icon/${iconFile}"
          alt=""
          draggable="false"
          style="width:46px;height:46px;object-fit:contain;display:block;"
          onerror="this.onerror=null;this.src='./icon/.png';"
        >
      </div>
    `,

    iconSize: [38, 38],

    iconAnchor: [19, 19]

  });

}

function getMapaThreatKind(threat) {
  return normalizeType(
    threat?.kind ||

}

function getMapaThreatTitle(threat) {
  const kind = getMapaThreatKind(threat);

  const titles = {
    drone_piston: "БпЛА Shahed / поршневий",
    drone_jet: "БпЛА реактивний",
    missile_cruise: "Крилата ракета",
    missile_ballistic: "Балістична ракета",
    bomb_glide: "Керована авіабомба",
    bomb: "Авіабомба"
  };

  if (titles[kind]) {
    return titles[kind];
  }

  if (threat?.title) {
    return String(threat.title);
  }

  if (threat?.kind) {
    return String(threat.kind);
  }

  return "Повітряна загроза";
}

function getMapaThreatIconFile(threat) {
  const kind = getMapaThreatKind(threat);

  if (

    kind === "drone_jet" ||
    kind === "uav" ||
    kind === "drone"

    return "uav.png";
  }
  if(kind === "drone_fpv")

  return "all.png";
}

function rememberMapaThreatPopup() {
  let key = null;

  mapaThreatLayerGroup.eachLayer(
    layer => {

      if (
        !key &&
        typeof layer.isPopupOpen === "function" &&
        layer.isPopupOpen()
      ) {
        key =
          layer._threatPopupKey ??
          null;
      }

    }
  );

  return key;
}

function restoreMapaThreatPopup(key) {
  if (!key) {
    return;
  }

  mapaThreatLayerGroup.eachLayer(
    layer => {

      if (
        layer._threatPopupKey === key &&
        typeof layer.openPopup === "function"
      ) {
        layer.openPopup();
      }

    }
  );
}

async function loadMapaThreats() {

  try {

    const response =
      await fetch(
        getMapaThreatsURL(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " +
        response.status
      );
    }

    const data =
      await response.json();

    const objects =
      Array.isArray(data?.objects)
        ? data.objects
        : [];

    mapaThreats =
      objects.filter(
        threat =>
          threat &&
          String(
            threat.status || ""
          ).toLowerCase() === "active" &&
          Number.isFinite(
            Number(threat.lat)
          ) &&
          Number.isFinite(
            Number(
              threat.lon ??
              threat.lng
            )
          )
      );

    renderMapaThreats();

    updateCategoryCounts();
    updateStatus();

    console.log(
      "MAPA.UA:",
      mapaThreats
    );

  } catch (error) {

    console.error(
      "MAPA.UA threats:",
      error
    );

    updateStatus();

  }

}

function updateVisibility() {

  /*
   * Google Sheets
   */

  sheetLayerGroup.eachLayer(
    layer => {

      const category =
        layer._category;

      if (
        visibleCategories[
          category
        ]
      ) {

        if (
          !map.hasLayer(layer)
        ) {

          map.addLayer(
            layer
          );

        }

      } else {

        if (
          map.hasLayer(layer)
        ) {

          map.removeLayer(
            layer
          );

        }

      }

    }
  );

  /*
   * MAPA UAV / threats
   */
  if (visibleCategories[MAPA_CATEGORY_THREAT]) {
    if (!map.hasLayer(mapaThreatLayerGroup)) map.addLayer(mapaThreatLayerGroup);
  } else {
    if (map.hasLayer(mapaThreatLayerGroup)) map.removeLayer(mapaThreatLayerGroup);
  }

  /*
   * NEPTUN UAV / threats
   */

  if (
    visibleCategories[
      NEPTUN_CATEGORY_UAV
    ]
  ) {

    if (
      !map.hasLayer(
        neptunThreatLayerGroup
      )
    ) {

      map.addLayer(
        neptunThreatLayerGroup
      );

    }

  } else {

    if (
      map.hasLayer(
        neptunThreatLayerGroup
      )
    ) {

      map.removeLayer(
        neptunThreatLayerGroup
      );

    }

  }

  /*
   * NEPTUN alerts = CATEGORY 1
   */

  if (
    visibleCategories[
      NEPTUN_CATEGORY_ALERT
    ]
  ) {

    if (
      !map.hasLayer(
        neptunRaionLayerGroup
      )
    ) {

      map.addLayer(
        neptunRaionLayerGroup
      );

    }

    if (
      !map.hasLayer(
        neptunOblastLayerGroup
      )
    ) {

      map.addLayer(
        neptunOblastLayerGroup
      );

    }

  } else {

    if (
      map.hasLayer(
        neptunRaionLayerGroup
      )
    ) {

      map.removeLayer(
        neptunRaionLayerGroup
      );

    }

    if (
      map.hasLayer(
        neptunOblastLayerGroup
      )
    ) {

      map.removeLayer(
        neptunOblastLayerGroup
      );

    }

  }

  updateCategoryCounts();

}

/* =========================================================
   CATEGORY COUNTS
========================================================= */

function updateCategoryCounts() {

  const counts = {};

  Object.keys(categories).forEach(
    id =>
      counts[id] = 0
  );

  /*
   * Google Sheets
   */

  sheetObjects.forEach(
    obj => {

      const type =
        getSheetCategory(
          obj
        );

      if (
        counts[type] !==
        undefined
      ) {

        counts[type]++;

      }

    }
  );

  /*
   * NEPTUN UAV
   */

  neptunThreats.forEach(
    threat => {

      const category =
        getNeptunThreatCategory(
          threat
        );

      if (
        counts[category] !==
        undefined
      ) {

        counts[category]++;

      }

    }
  );

  /*
   * MAPA UAV
   */
  mapaThreats.forEach(() => {
    if (counts[MAPA_CATEGORY_THREAT] !== undefined) counts[MAPA_CATEGORY_THREAT]++;
  });

  /*
   * NEPTUN air alerts
   *
   * район + область считаються
   * частиною категорії 1.
   */

  counts["1"] +=
    neptunAlerts.length;

  counts["1"] +=
    neptunAlertOblasts.length;

  Object.keys(categories).forEach(
    id => {

      const element =
        document.getElementById(
          "count-" + id
        );

      if (element) {

        element.textContent =
          counts[id];

      }

    }
  );

}

/* =========================================================
   NORMALIZE NAME
========================================================= */

function normalizeName(value) {

  return String(
    value || ""
  )
    .toLowerCase()
    .replaceAll(
      "’",
      "'"
    )
    .replaceAll(
      "`",
      "'"
    )
    .replace(
      /область$/u,
      ""
    )
    .replace(
      /район$/u,
      ""
    )
    .replace(
      /області$/u,
      ""
    )
    .replace(
      /району$/u,
      ""
    )
    .replace(
      /[^а-яіїєґa-z0-9]/giu,
      ""
    );

}

/* =========================================================
   GET ALL GEOJSON PROPERTY NAMES
========================================================= */

function getFeatureNames(
  feature
) {

  const props =
    feature?.properties ||
    {};

  const values = [];

  Object.keys(props).forEach(
    key => {

      const value =
        props[key];

      if (
        typeof value ===
        "string"
      ) {

        values.push(
          value
        );

      }

    }
  );

  return values;

}

/* =========================================================
   GEOJSON FEATURE MATCH
========================================================= */

function featureMatchesAlert(
  feature,
  alert
) {

  const alertName =
    normalizeName(
      alert?.name
    );

  if (!alertName) {

    return false;

  }

  return getFeatureNames(
    feature
  ).some(
    name =>
      normalizeName(
        name
      ) ===
      alertName
  );

}

function getAlertStyle(
  alert,
  isOblast
) {
  const level = String(alert?.level || "red").toLowerCase();
  const isYellow = level === "yellow" || level === "amber";
  const color = isYellow ? "#f5b82e" : "#ff3448";

  // Чёткие административные контуры без тяжёлой заливки,
  // из-за которой соседние полигоны выглядят как один кривой блок.
  return {
    color: isYellow ? "#ffd166" : "#ff5a68",
    weight: isOblast ? 2.4 : 1.25,
    opacity: isOblast ? 0.98 : 0.92,
    lineCap: "round",
    lineJoin: "round",
    fillColor: color,
    fillOpacity: isOblast ? 0.10 : 0.34,
    smoothFactor: 0.35,
    interactive: false
  };
}

function geoNameToSlug(value) {
  const transliteration = {
    "а":"a","б":"b","в":"v","г":"h","ґ":"g","д":"d","е":"e","є":"ye",
    "ж":"zh","з":"z","и":"y","і":"i","ї":"yi","й":"y","к":"k","л":"l",
    "м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f",
    "х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ь":"","ю":"yu","я":"ya",
    "ы":"y","э":"e","ё":"yo","'":"","ʼ":"","’":"","`":""
  };
  return String(value || "")
    .toLowerCase()
    .split("")
    .map(ch => transliteration[ch] !== undefined ? transliteration[ch] : ch)
    .join("")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/_+/g, "_")
    .replace(/^_|_$/g, "");
}

async function fetchGeoJSON(url) {
  const response = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), {
    cache: "no-store"
  });
  if (!response.ok) throw new Error("GeoJSON HTTP " + response.status + ": " + url);
  const data = await response.json();
  if (!data || typeof data !== "object" || !Array.isArray(data.features)) {
    throw new Error("Некоректний GeoJSON: " + url);
  }
  return data;
}

async function loadNeptunGeoJSON() {
  try {
    // Сначала загружаем настоящие контуры областей Украины.
    const newOblastsGeoJSON = await fetchGeoJSON(OBLASTS_GEOJSON_URL);

    // Затем — отдельные наборы районов каждой области. Это заменяет старый
    // общий файл с несовпадающими/устаревшими геометриями.
    const oblastFeatures = newOblastsGeoJSON.features;
    const districtResults = await Promise.allSettled(
      oblastFeatures.map(async feature => {
        const props = feature?.properties || {};
        const name = typeof props.name === "string"
          ? props.name
          : (typeof props.NAME_1 === "string" ? props.NAME_1 : "");
        if (!name) return [];
        const slug = geoNameToSlug(name);
        if (!slug) return [];
        const districtGeoJSON = await fetchGeoJSON(GEOJSON_BASE_URL + "/" + slug + ".geojson");
        return districtGeoJSON.features || [];
      })
    );

    const allDistrictFeatures = [];
    let successfulRegionFiles = 0;
    districtResults.forEach(result => {
      if (result.status === "fulfilled") {
        successfulRegionFiles++;
        allDistrictFeatures.push(...result.value);
      } else {
        console.warn("Не вдалося завантажити GeoJSON районів області:", result.reason);
      }
    });

    if (!newOblastsGeoJSON.features.length) {
      throw new Error("GeoJSON областей не містить об’єктів");
    }
    if (successfulRegionFiles === 0 || allDistrictFeatures.length === 0) {
      throw new Error("Не вдалося завантажити GeoJSON районів жодної області");
    }

    raionsGeoJSON = {
      type: "FeatureCollection",
      features: allDistrictFeatures
    };
    oblastsGeoJSON = newOblastsGeoJSON;

    // Окремо підсвічуємо межу АР Крим та Севастополя незалежно від наявності тривоги.
    // Шар містить лише контури, тому не перекриває кольори актуальних тривог.
    if (window.crimeaOutlineLayer) {
      window.crimeaOutlineLayer.clearLayers();
    } else {
      window.crimeaOutlineLayer = L.layerGroup().addTo(map);
    }
    const isCrimeaOrSevastopol = feature => {
      const p = feature && feature.properties ? feature.properties : {};
      const n = String(p.name || p.NAME_1 || p.NAME || p.admin1Name || p.shapeName || "").toLowerCase();
      return n.includes("крим") || n.includes("crimea") || n.includes("sevastopol") || n.includes("севастоп") || n.includes("севастополь");
    };
    newOblastsGeoJSON.features.filter(isCrimeaOrSevastopol).forEach(feature => {
      L.geoJSON(feature, {
        interactive: false,
        style: { color: "#65c7ff", weight: 2.8, opacity: 1, fillOpacity: 0 }
      }).addTo(window.crimeaOutlineLayer);
    });

    console.log("GeoJSON областей завантажено:", oblastsGeoJSON.features.length);
    console.log("GeoJSON районов загружено:", raionsGeoJSON.features.length,
      "из", successfulRegionFiles, "файлов областей");

    renderAlertZones();
    updateStatus();
  } catch (error) {
    console.error("GeoJSON NEPTUN:", error);
    // Если новая геометрия не загрузилась, показуємо лише дані поточного сеансу.
    renderAlertZones();
    updateStatus();
  }
}

function safeThreatText(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}
function threatLevelInfo(level) {
  const n = Number(level);
  if (Number.isFinite(n)) {
    if (n >= 5) return {kind:"red", label:"Червоний рівень"};
    if (n >= 3) return {kind:"yellow", label:"Жовтий рівень"};
    return {kind:"neutral", label:"Інший статус"};
  }
  const value = String(level || "").toLowerCase();
  if (/red|червон/.test(value)) return {kind:"red", label:"Червоний рівень"};
  if (/yellow|amber|жовт/.test(value)) return {kind:"yellow", label:"Жовтий рівень"};
  return {kind:"neutral", label:value ? "Рівень: " + String(level) : "Рівень не вказано"};
}
function normalizeAreaName(value) {
  return normalizeName(String(value || "")
    .replace(/\b(область|обл\.|район|районі)\b/gi, "")
    .replace(/[^а-яіїєґa-z0-9]/gi, ""));
}
function threatsForOblast(oblastName) {
  const needle = normalizeAreaName(oblastName);
  return customThreats.filter(item => {

function formatThreatSince(value) {
  if (!value || value === "-") return "Час початку не вказано";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return safeThreatText(value);
  return date.toLocaleString("uk-UA", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
}
function getNeptunAreaItems(oblastName) {
  const needle = normalizeAreaName(oblastName);
  const source = [
    ...neptunAlertOblasts.map(item => ({...item, _source:"NEPTUN", _isAlert:true})),
    ...neptunAlerts.map(item => ({...item, _source:"NEPTUN", _isAlert:true}))
  ];
  return source.filter(item => {
    const candidates = [
      item.oblast, item.oblastName, item.region, item.regionName,
      item.admin1, item.admin1Name, item.area, item.name
    ].filter(Boolean);
    return candidates.some(value => {
      const target = normalizeAreaName(value);
      return target && (target === needle || (target.length > 5 && needle.includes(target)));
    });
  });
}
function customColorForOblast(oblastName) {
  const needle = normalizeAreaName(oblastName);
  const item = customThreats.find(entry => {
    const target = normalizeAreaName(entry.oblast || entry.name || "");

async function loadCustomThreats() {
  // Avoid overlapping polls: slow connections must not cause older requests
  // to overwrite a newer successful result.
  if (customThreatsRequestInFlight) return;
  customThreatsRequestInFlight = true;
  try {
    const response = await fetch(CUSTOM_THREATS_URL + "?t=" + Date.now(), {
      cache: "no-store",
      headers: { "Accept": "application/json" }
    });
    if (!response.ok) throw new Error("alarm.json HTTP " + response.status);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("alarm.json має бути масивом");

    const nextThreats = data.filter(item => item && typeof item === "object" && (item.name || item.oblast));
    // Replace the current list only after a complete, valid response arrives.
    customThreats = nextThreats;
    try {
      localStorage.setItem(CUSTOM_THREATS_CACHE_KEY, JSON.stringify(customThreats));
    } catch (cacheError) {
      // Private browsing / full storage must not break alert rendering.
      console.warn("Не вдалося зберегти кеш кастомних тривог:", cacheError);
    }

    if (window.areaHistoryGeoRef) {
      window.areaHistoryGeoRef = null;
      if (typeof renderAlertZones === "function") renderAlertZones();
    }
    if (mapHistoryDialog.open) showAreaHistory(mapHistoryTitle.textContent);
    console.log("AirThreatMap custom threats:", customThreats.length);
  } catch (error) {
    console.warn("Не вдалося оновити кастомні тривоги; залишаємо останні доступні дані:", error);
    // Intentionally preserve customThreats. Transient GitHub/network errors
    // previously emptied this array, making custom alerts disappear until reload.
    if (mapHistoryDialog.open) showAreaHistory(mapHistoryTitle.textContent);
  } finally {
    customThreatsRequestInFlight = false;
  }
}

/* =========================================================
   GET THREAT CATEGORY
========================================================= */

function getNeptunThreatCategory(
  threat
) {

  const type =
    normalizeType(
      threat?.type
    );

  /*
   * ШАХЕД / БПЛА
   *
   * ВСЕ UAV -> КАТЕГОРІЯ 2
   */

  if (
    type === "uav"
  ) {

    return NEPTUN_CATEGORY_UAV;

  }

  /*
   * Інші повітряні загрози
   * також відносимо до авіації.
   */

  if (
    type === "missile" ||
    type === "rocket" ||
    type === "aircraft" ||
    type === "plane"
  ) {

    return NEPTUN_CATEGORY_UAV;

  }

  return NEPTUN_CATEGORY_UAV;

}

/* =========================================================
   THREAT POSITION
========================================================= */

function getThreatPosition(
  threat
) {

  /*
   * НЕПТУН SDK prediction
   */

  try {

    if (
      window.NEPTUN &&
      typeof NEPTUN.predict ===
        "function"
    ) {

      const predicted =
        NEPTUN.predict(
          threat,
          Date.now()
        );

      if (
        predicted &&
        Number.isFinite(
          Number(
            predicted.lat
          )
        ) &&
        Number.isFinite(
          Number(
            predicted.lon
          )
        )
      ) {

        return [
          Number(
            predicted.lat
          ),
          Number(
            predicted.lon
          )
        ];

      }

    }

  } catch (error) {

    console.warn(
      "NEPTUN predict error:",
      error
    );

  }

  /*
   * Fallback
   */

  if (
    Number.isFinite(
      Number(
        threat?.lat
      )
    ) &&
    Number.isFinite(
      Number(
        threat?.lon
      )
    )
  ) {

    return [
      Number(
        threat.lat
      ),
      Number(
        threat.lon
      )
    ];

  }

  return null;

}

}

function buildThreatPopup(threat, emoji) {
  const type = normalizeType(threat?.type);
  const title = escapeThreatPopupText(getThreatTitle(threat));
  const heading = threat?.heading != null && Number.isFinite(Number(threat.heading))
    ? `${escapeThreatPopupText(String(threat.heading))}°`
    : "Невідомо";
  const explanation = escapeThreatPopupText(threat?.explanationShort || "Додаткового опису немає.");
  const typeLabel = type === "uav" ? "БЕЗПІЛОТНИЙ ЛІТАЛЬНИЙ АПАРАТ" : "ПОВІТРЯНИЙ ОБ’ЄКТ";
  return `
    <div class="uav-card">
      <div class="uav-card__head">
        <div class="uav-card__symbol" aria-hidden="true">${emoji}</div>
        <div>
          <div class="uav-card__eyebrow">${typeLabel}</div>
          <div class="uav-card__title">${title}</div>
        </div>
      </div>
      <div class="uav-card__body">
        ${threat?.advisory ? '<div class="uav-card__advisory">⚠️ Спостереження · advisory</div>' : ''}
        <div class="uav-card__grid">
          <div class="uav-card__metric"><div class="uav-card__label">Курс</div><div class="uav-card__value">${heading}</div></div>
          <div class="uav-card__metric"><div class="uav-card__label">Джерело</div><div class="uav-card__value">NEPTUN</div></div>
        </div>
        <div class="uav-card__description">${explanation}</div>
      </div>
      <div class="uav-card__foot"><span>Інформаційне повідомлення</span><a class="uav-card__source" href="https://neptun.in.ua/" target="_blank" rel="noopener noreferrer">ДЖЕРЕЛО ↗</a></div>
    </div>`;
}

/* =========================================================
   THREAT TITLE
========================================================= */

function getThreatTitle(
  threat
) {

  const type =
    normalizeType(
      threat?.type
    );

  if (
    type === "uav"
  ) {

    return "Тип : БпЛА";

  }

  if (
    threat?.title
  ) {

    return "Тип : "+ String(
      threat.title
    );

  }

  if (
    threat?.name
  ) {

    return String(
      threat.name
    );

  }

  return "Тип : Невідомо";

}

/* =========================================================
   KEEP OPEN THREAT POPUP DURING NEPTUN/Nahr RERENDER
========================================================= */
function getThreatPopupKey(threat) {
  if (!threat) return null;
  const id = threat.id ?? threat.uuid ?? threat._id ?? threat.threatId ?? threat.threat_id;
  if (id != null && String(id).trim() !== "") return "id:" + String(id);
  const position = getThreatPosition(threat);
  return [
    "fallback",
    position ? Number(position[0]).toFixed(6) : "",
    position ? Number(position[1]).toFixed(6) : "",
    normalizeType(threat.type),
    threat.title ?? threat.name ?? "",
    threat.locality ?? ""
  ].join("|");
}

function rememberOpenThreatPopup() {
  let key = null;
  neptunThreatLayerGroup.eachLayer(layer => {
    if (!key && typeof layer.isPopupOpen === "function" && layer.isPopupOpen()) {
      key = layer._threatPopupKey ?? null;
    }
  });
  return key;
}

function restoreOpenThreatPopup(key) {
  if (!key) return;
  neptunThreatLayerGroup.eachLayer(layer => {
    if (layer._threatPopupKey === key && typeof layer.openPopup === "function") {
      layer.openPopup();
    }
  });
}

/* =========================================================
   LOAD NEPTUN ALERTS REST
========================================================= */

async function loadNeptunAlerts() {

  try {

    const response =
      await fetch(
        NEPTUN_ALERTS_URL +
        "?t=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const data =
      await response.json();
    
    const daaa= await data
    console.log(
      daaa
    );
    /*
     * API має повернути обидва масиви.
     *
     * Якщо структура зовсім інша,
     * не перезаписуємо поточні дані.
     */

    if (
      !Array.isArray(
        data?.raions
      ) ||
      !Array.isArray(
        data?.oblasts
      )
    ) {

      throw new Error(
        "NEPTUN alerts повернув некоректну структуру"
      );

    }
    

    /*
     * Райони
     */

    neptunAlerts =
      data.raions;

    /*
     * Області
     */

    neptunAlertOblasts =
      data.oblasts;
    
    console.log(
      "NEPTUN райони:",
      neptunAlerts
    );
    

    console.log(
      "NEPTUN області:",
      neptunAlertOblasts
    );

    renderAlertZones();

    updateAlertBadge();

    updateCategoryCounts();

    updateStatus();

    /*
     * Зберігаємо тільки після
     * успішної валідної відповіді.
     */

  } catch (error) {

    console.error(
      "NEPTUN alerts:",
      error
    );

    /*
     * Не очищаємо старі дані.
     */

    updateStatus();

  }

}

/* =========================================================
   LOAD NEPTUN THREATS REST
========================================================= */

async function loadNeptunThreats() {

  try {

    const response =
      await fetch(
        NEPTUN_THREATS_URL +
        "?t=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    /*
     * API може повернути:
     *
     * масив
     *
     * або
     *
     * { threats: [] }
     */

    let newThreats = null;

    if (
      Array.isArray(data)
    ) {

      newThreats =
        data;

    } else if (
      Array.isArray(
        data?.threats
      )
    ) {

      newThreats =
        data.threats;

    } else {

      throw new Error(
        "NEPTUN threats повернув некоректну структуру"
      );

    }

    /*
     * Тільки валідний масив
     * замінює поточні дані.
     */

    neptunThreats =
      newThreats;

    renderNeptunThreats();

    updateCategoryCounts();
    console.log(
      "NEPTUN:",
      data
    );
    updateStatus();

    /*
     * Зберігаємо актуальні загрози.
     */

  } catch (error) {

    console.error(
      "NEPTUN threats:",
      error
    );

    /*
     * Старі загрози залишаються.
     */

    updateStatus();

  }

}

/* =========================================================
   ALERT BADGE
========================================================= */

function updateAlertBadge() {

  const badge =
    document.getElementById(
      "alertBadge"
    );

  /*
   * alertBadge зараз закоментований.
   *
   * Якщо його немає — просто виходимо.
   */

  if (!badge) {

    return;

  }

  const hasAlerts =
    neptunAlerts.length > 0 ||
    neptunAlertOblasts.length > 0;

  if (hasAlerts) {

    badge.style.display =
      "block";

  } else {

    badge.style.display =
      "none";

  }

}

/* =========================================================
   STATUS
========================================================= */

function updateStatus() {
  const status = document.getElementById("status");
  if (!status) return;

  const alerts = neptunAlerts.length + neptunAlertOblasts.length;
  const uavs = neptunThreats.filter(threat =>
    getNeptunThreatCategory(threat) === NEPTUN_CATEGORY_UAV
  ).length;
  const news = sheetObjects.filter(obj => getSheetCategory(obj) === "13").length;
  const networkText = navigator.onLine ? "🟢 ОНЛАЙН" : "🔴 ОФЛАЙН";

  status.innerHTML = `
    ${networkText}
    <br><br>
    Google Sheets: ${sheetObjects.length}
    <br>
    📰 Новин: ${news}
    <br>
    NEPTUN тривог: ${alerts}
    <br>
    NEPTUN БпЛА: ${uavs}
  `;
}

/* =========================================================
   NEPTUN REALTIME
========================================================= */

let neptunRealtimeClient =
  null;

function startNeptunRealtime() {

  try {

    if (
      !window.NEPTUN ||
      typeof NEPTUN.RealtimeClient !==
        "function"
    ) {

      console.warn(
        "NEPTUN RealtimeClient недоступний"
      );

      return;

    }

    neptunRealtimeClient =
      new NEPTUN.RealtimeClient(
        NEPTUN_URL
      );

    neptunRealtimeClient.subscribe(
      snapshot => {

        console.log(
          "NEPTUN realtime snapshot:",
          snapshot
        );

        /*
         * Прапорець:
         *
         * чи отримали ми хоча б
         * одне валідне поле.
         */

        let changed =
          false;

        /*
         * Загрози
         */

        if (
          Array.isArray(
            snapshot?.threats
          )
        ) {

          neptunThreats =
            snapshot.threats;

          changed = true;

          renderNeptunThreats();

        }

        /*
         * Районні тривоги
         *
         * КАТЕГОРІЯ 1
         */

        if (
          Array.isArray(
            snapshot?.alerts
          )
        ) {

          neptunAlerts =
            snapshot.alerts;

          changed = true;

        }

        /*
         * Обласні тривоги
         *
         * КАТЕГОРІЯ 1
         */

        if (
          Array.isArray(
            snapshot?.alertOblasts
          )
        ) {

          neptunAlertOblasts =
            snapshot.alertOblasts;

          changed = true;

        }

        /*
         * Якщо snapshot містив хоча б
         * одне валідне поле — перемальовуємо
         * та зберігаємо.
         */

        if (changed) {

          renderAlertZones();

          updateAlertBadge();

          updateCategoryCounts();

          updateStatus();

          /*
           * ВАЖЛИВО:
           *
           * realtime snapshot може не містити
           * GeoJSON, тому дані не записуються в постійне сховище.
           */

        }

      }
    );

    neptunRealtimeClient.start();

    console.log(
      "NEPTUN realtime запущено"
    );

  } catch (error) {

    console.error(
      "NEPTUN realtime:",
      error
    );

  }

}

/* =========================================================
   INITIALIZATION
========================================================= */

async function init() {

  createCategoryPanel();

  // No persistent cache restoration: fetch current data on every page load.
  updateVisibility();
  updateStatus();

  /*
   * =======================================================
   * ДАЛІ — МЕРЕЖА
   * =======================================================
   *
   * Не покладаємося тільки на navigator.onLine.
   * На телефонах він інколи каже "online", хоча fetch
   * фактично не працює. Дані не зберігаються між відкриттями сторінки.
   */

  updateStatus();

  const networkLoads = [
    loadNeptunGeoJSON(),
    loadNeptunAlerts(),
    loadNeptunThreats(),
    loadMapaThreats(),
    loadCustomThreats()
  ];

  await Promise.allSettled(
    networkLoads
  );

  /*
   * =======================================================
   * NEPTUN REALTIME
   * =======================================================
   */

  if (
    navigator.onLine
  ) {

    startNeptunRealtime();

  }

  /*
   * =======================================================
   * ПЕРІОДИЧНЕ РЕЗЕРВНЕ ОНОВЛЕННЯ
   * =======================================================
   */

  

  setInterval(
    function() {

      if (
        navigator.onLine
      ) {

        loadNeptunAlerts();

      }

    },
    15000
  );
  
  setInterval(
    function() {

      if (
        navigator.onLine
      ) {

        loadNeptunThreats();

      }

    },
    15000
  );

  setInterval(
    function() {
      if (navigator.onLine) {
        loadMapaThreats();
      }
    },
    15000
  );

  setInterval(function() { if (navigator.onLine) loadCustomThreats(); }, 60000);

  /*
   * Оновлюємо індикатор мережі періодично.
   */

  setInterval(
    function() {

      updateStatus();

    },
    30000
  );

  updateVisibility();

  updateStatus();

}

/* =========================================================
   START
========================================================= */

init();

</script>
