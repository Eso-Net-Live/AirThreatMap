 position:absolute;z-index:1000;top:16px;left:16px;width:340px;max-width:calc(100vw - 32px);

<!-- NEPTUN SDK -->
<script src="https://neptun.in.ua/sdk/neptun.js"></script>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT
========================================================= */
// Не буде, поки що
/* =========================================================
   NEPTUN
========================================================= */

const NEPTUN_URL =
  "https://neptun.in.ua";
const NAHR_URL = 
  "https://radar.nahr.uk/";


const NEPTUN_ALERTS_URL =
  NEPTUN_URL + "/api/v1/alerts";


const NEPTUN_THREATS_URL =
  NEPTUN_URL + "/api/v1/threats";

const MAPA_THREATS_URL =
  "https://mapa.ua/api/v1/current";

function getMapaThreatsURL() {
  return MAPA_THREATS_URL + "?t=" + Date.now();
}


const NAHR_THREATS_URL = 
  NAHR_URL + "api/alerts?et=1789153733-yveXuMVeU6fjv1EfFNowVYVTqmT2JumGutWY4XqOW8M";
  
const NEPTUN_CATEGORY_ALERT = "1";
const NEPTUN_CATEGORY_UAV = "2";
const MAPA_CATEGORY_THREAT = "3";

/*
 * NEPTUN API не отдаёт нам готовые границы через указанные
 * endpoints GeoJSON, поэтому используем публичные GeoJSON
 * административных границ Украины.
 */

// Актуальні межі з OSM administrative boundaries (GeoJSON).
// Ukraine.geojson містить межі областей; окремі файли областей — їхні райони.
const GEOJSON_BASE_URL =
  "https://cdn.jsdelivr.net/gh/darmat1/ukraine-geo-data@main/geodata";
const OBLASTS_GEOJSON_URL = GEOJSON_BASE_URL + "/Ukraine.geojson";
const OBLAST_GEOJSON_RU_URL = "https://raw.githubusercontent.com/datasets/geo-boundaries-world-1/master/countries/RUS.geojson"
/* =========================================================
   КАТЕГОРІЇ
========================================================= */

const categories = {

  "1": {
    name: "🚨 Повітряна тривога",
    emoji: "🚨",
    radius: 3000,
    color: "#ff0000",
    minZoom: 0,
    show: true
  },

  "2": {
    name: "✈️ БПЛА",
    emoji: "✈️",
    radius: 2500,
    color: "#ff9900",
    minZoom: 0,
    show: true
  },
  "3": {
    name: "🛩️ БПЛА (Розширений режим)",
    emoji: "🛩️",
    radius: 2500,
    color: "#ff9900",
    minZoom: 0,
    show: false
  },

};

/* =========================================================
   MAP
========================================================= */

const UKRAINE_VIEW_BOUNDS = L.latLngBounds([[44.0, 21.0], [53.0, 41.0]]);

const map =
  L.map("map", {
    zoomControl: true,
    maxBounds: UKRAINE_VIEW_BOUNDS,
    maxBoundsViscosity: 0.92,
    minZoom: 6
  }).setView([48.38, 31.17], 6);

/* =========================================================
   TILE
========================================================= */

// Темна картографічна підкладка CARTO.
const CARTO_BASEMAP_KEY = "cb1_4p71_1_bc1eb1f9cdb46f6143101482";
const CARTO_DARK_TILES = "https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key=" + CARTO_BASEMAP_KEY;

L.tileLayer(CARTO_DARK_TILES, {
  subdomains: "abcd",
  maxZoom: 20,
  attribution: "© OpenStreetMap contributors © CARTO"
}).addTo(map);

/* =========================================================
   МАСКА: ПОЗА МЕЖАМИ УКРАЇНИ — ТЕМНЕ ПОЛЕ
========================================================= */
// Перевіряємо ISO-код та назви країни, щоб не затемнити Крим окремо від України.
const WORLD_COUNTRIES_GEOJSON_URL = "https://cdn.jsdelivr.net/gh/datasets/geo-countries@main/data/countries.geojson";
const ukraineOutlineLayer = L.layerGroup().addTo(map);

fetch(WORLD_COUNTRIES_GEOJSON_URL)
  .then(response => {
    if (!response.ok) throw new Error("Не вдалося завантажити межі країн");
    return response.json();
  })
  .then(data => {
    const features = Array.isArray(data.features) ? data.features : [];
    const isUkraineFeature = feature => {
      const props = feature && feature.properties ? feature.properties : {};
      const iso = String(props["ISO3166-1-Alpha-3"] || props.ISO_A3 || props.iso_a3 || props.ADM0_A3 || "").trim().toUpperCase();
      const name = String(props.name || props.NAME || props.ADMIN || props.admin || props.NAME_EN || "").trim().toLowerCase();
      return iso === "UKR" || ["ukraine", "україна", "украина"].includes(name);
    };
    const ukraineFeature = features.find(isUkraineFeature);
    const isRussiaFeature = feature => {
      const props = feature && feature.properties ? feature.properties : {};
      const iso = String(props["ISO3166-1-Alpha-3"] || props.ISO_A3 || props.iso_a3 || props.ADM0_A3 || "").trim().toUpperCase();
      const name = String(props.name || props.NAME || props.ADMIN || props.admin || props.NAME_EN || "").trim().toLowerCase();
      return iso === "RUS" || ["russia", "russian federation", "росія", "россия"].includes(name);
    };

    // У деяких світових наборах Крим помилково входить до геометрії Росії.
    // Якщо він окремим полігоном у MultiPolygon, прибираємо саме цей полігон з маски.
    const otherCountries = features
      .filter(feature => !isUkraineFeature(feature))
      .map(feature => {
        if (!isRussiaFeature(feature) || !feature.geometry) return feature;
        const geometry = feature.geometry;
        const isCrimeaPolygon = ringSet => {
          const ring = Array.isArray(ringSet) && Array.isArray(ringSet[0]) ? ringSet[0] : ringSet;
          if (!Array.isArray(ring) || !ring.length) return false;
          const xs = ring.map(point => point[0]).filter(Number.isFinite);
          const ys = ring.map(point => point[1]).filter(Number.isFinite);
          if (!xs.length || !ys.length) return false;
          const minX = Math.min(...xs), maxX = Math.max(...xs);
          const minY = Math.min(...ys), maxY = Math.max(...ys);
          // Кримський півострів: полігон має повністю вкладатися в цей географічний діапазон.
          return minX >= 32.0 && maxX <= 37.2 && minY >= 43.8 && maxY <= 47.0;
        };
        if (geometry.type === "MultiPolygon" && Array.isArray(geometry.coordinates)) {
          const coordinates = geometry.coordinates.filter(poly => !isCrimeaPolygon(poly));
          return { ...feature, geometry: { ...geometry, coordinates } };
        }
        if (geometry.type === "Polygon" && isCrimeaPolygon(geometry.coordinates)) {
          return null;
        }
        return feature;
      })
      .filter(Boolean);

    // Інші держави затемнені. Російська геометрія не повинна накривати Крим.
    L.geoJSON({ type: "FeatureCollection", features: otherCountries }, {
      interactive: false,
      style: {
        color: "#090d13", weight: 1, opacity: 0.95,
        fillColor: "#05080d", fillOpacity: 0.94
      }
    }).addTo(map);

    if (ukraineFeature) {
      L.geoJSON(ukraineFeature, {
        interactive: false,
        style: { color: "#62a9ff", weight: 2, opacity: 0.95, fillOpacity: 0 }
      }).addTo(ukraineOutlineLayer);
    } else {
      console.warn("У GeoJSON не знайдено Україну за ISO-кодом UKR");
    }
  })
  .catch(error => console.warn("Маска меж України недоступна:", error));

/* =========================================================
   LAYERS
========================================================= */

const sheetLayerGroup =
  L.layerGroup().addTo(map);

const neptunThreatLayerGroup =
  L.layerGroup().addTo(map);

const mapaThreatLayerGroup =
  L.layerGroup().addTo(map);

const neptunRaionLayerGroup =
  L.layerGroup().addTo(map);

const neptunOblastLayerGroup =
  L.layerGroup().addTo(map);

/* =========================================================
   DATA
========================================================= */

let sheetObjects = [];

let neptunThreats = [];

let mapaThreats = [];

let neptunAlerts = [];

let neptunAlertOblasts = [];

let raionsGeoJSON = null;

let oblastsGeoJSON = null;

/* =========================================================
   OFFLINE INDEXEDDB
========================================================= */

/*
 * У IndexedDB зберігаємо весь стан карти.
 *
 * Це важливо:
 *
 * Google Sheets
 * NEPTUN threats
 * NEPTUN alerts
 * GeoJSON
 *
 * після успішного онлайн-завантаження залишаються
 * доступними навіть після повного закриття браузера.
 */

const OFFLINE_DB_NAME =
  "MapaPodiyUA_Offline";

const OFFLINE_DB_VERSION = 1;

const OFFLINE_STORE_NAME =
  "mapCache";

const OFFLINE_CACHE_KEY =
  "state";

/*
 * MOBILE FALLBACK
 *
 * Деякі мобільні браузери/режими можуть блокувати або
 * ламати IndexedDB. Тому маємо другий незалежний кеш.
 */
const OFFLINE_LOCAL_KEY =
  "MapaPodiyUA_Offline_v2";

let offlineDBPromise = null;

let offlineCacheSavedAt = 0;

let offlineCacheLoaded = false;

let offlineWriteQueue =
  Promise.resolve();

/* =========================================================
   OPEN INDEXEDDB
========================================================= */

function openOfflineDB() {

  if (offlineDBPromise) {
    return offlineDBPromise;
  }

  offlineDBPromise =
    new Promise((resolve, reject) => {

      if (!("indexedDB" in window)) {

        reject(
          new Error(
            "IndexedDB не підтримується браузером"
          )
        );

        return;
      }

      const request =
        indexedDB.open(
          OFFLINE_DB_NAME,
          OFFLINE_DB_VERSION
        );

      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;

          if (
            !db.objectStoreNames.contains(
              OFFLINE_STORE_NAME
            )
          ) {

            db.createObjectStore(
              OFFLINE_STORE_NAME
            );

          }

        };

      request.onsuccess =
        function(event) {

          const db =
            event.target.result;

          // db.onversionchange =
          //   function() {

          //     db.close();

          //   };

          resolve(db);

        };

      request.onerror =
        function() {

          reject(
            request.error ||
            new Error(
              "Не вдалося відкрити IndexedDB"
            )
          );

        };

    });

  return offlineDBPromise;

}

/* =========================================================
   SAVE OFFLINE STATE
========================================================= */

function saveOfflineState() {

  offlineWriteQueue =
    offlineWriteQueue
      .then(async () => {

        const state = {

          version:
            OFFLINE_DB_VERSION,

          savedAt:
            Date.now(),

          sheetObjects:
            Array.isArray(sheetObjects)
              ? sheetObjects
              : [],

          neptunThreats:
            Array.isArray(neptunThreats)
              ? neptunThreats
              : [],

          mapaThreats:
            Array.isArray(mapaThreats)
              ? mapaThreats
              : [],

          neptunAlerts:
            Array.isArray(neptunAlerts)
              ? neptunAlerts
              : [],

          neptunAlertOblasts:
            Array.isArray(neptunAlertOblasts)
              ? neptunAlertOblasts
              : [],

          raionsGeoJSON:
            raionsGeoJSON || null,

          oblastsGeoJSON:
            oblastsGeoJSON || null

        };

        let saved = false;

        /*
         * 1. Основний кеш — IndexedDB.
         */
        try {

          const db =
            await openOfflineDB();

          await new Promise(
            (resolve, reject) => {

              const transaction =
                db.transaction(
                  OFFLINE_STORE_NAME,
                  "readwrite"
                );

              const store =
                transaction.objectStore(
                  OFFLINE_STORE_NAME
                );

              const request =
                store.put(
                  state,
                  OFFLINE_CACHE_KEY
                );

              request.onsuccess =
                () => resolve();

              request.onerror =
                () => reject(
                  request.error ||
                  new Error(
                    "IndexedDB put error"
                  )
                );

              transaction.onerror =
                () => reject(
                  transaction.error ||
                  new Error(
                    "IndexedDB transaction error"
                  )
                );

            }
          );

          saved = true;

          console.log(
            "OFFLINE: IndexedDB збережено"
          );

        } catch (error) {

          console.warn(
            "OFFLINE: IndexedDB save failed:",
            error
          );

        }

        /*
         * 2. Дубльований fallback — localStorage.
         *
         * Це особливо важливо для мобільних браузерів.
         */
        try {

          localStorage.setItem(
            OFFLINE_LOCAL_KEY,
            JSON.stringify(state)
          );

          saved = true;

          console.log(
            "OFFLINE: localStorage збережено"
          );

        } catch (error) {

          console.warn(
            "OFFLINE: localStorage save failed:",
            error
          );

        }

        if (saved) {

          offlineCacheSavedAt =
            state.savedAt;

          offlineCacheLoaded =
            true;

          updateStatus();

        } else {

          throw new Error(
            "Не вдалося зберегти кеш ні в IndexedDB, ні в localStorage"
          );

        }

      })
      .catch(error => {

        console.warn(
          "OFFLINE: помилка збереження:",
          error
        );

        updateStatus();

      });

  return offlineWriteQueue;

}

/* =========================================================
   LOAD OFFLINE STATE
========================================================= */

async function loadOfflineState() {

  /*
   * Спочатку пробуємо IndexedDB.
   */
  try {

    const db =
      await openOfflineDB();

    const state =
      await new Promise(
        (resolve, reject) => {

          const transaction =
            db.transaction(
              OFFLINE_STORE_NAME,
              "readonly"
            );

          const store =
            transaction.objectStore(
              OFFLINE_STORE_NAME
            );

          const request =
            store.get(
              OFFLINE_CACHE_KEY
            );

          request.onsuccess =
            () => resolve(
              request.result || null
            );

          request.onerror =
            () => reject(
              request.error ||
              new Error(
                "IndexedDB get error"
              )
            );

        }
      );

    if (
      state &&
      state.version ===
        OFFLINE_DB_VERSION
    ) {

      console.log(
        "OFFLINE: кеш знайдено в IndexedDB"
      );

      return state;

    }

  } catch (error) {

    console.warn(
      "OFFLINE: IndexedDB read failed:",
      error
    );

  }

  /*
   * Якщо IndexedDB недоступний або порожній —
   * пробуємо localStorage.
   */
  try {

    const raw =
      localStorage.getItem(
        OFFLINE_LOCAL_KEY
      );

    if (!raw) {

      console.log(
        "OFFLINE: localStorage кеш відсутній"
      );

      return null;

    }

    const state =
      JSON.parse(raw);

    if (
      !state ||
      state.version !==
        OFFLINE_DB_VERSION
    ) {

      console.warn(
        "OFFLINE: localStorage кеш іншої версії"
      );

      return null;

    }

    console.log(
      "OFFLINE: кеш знайдено в localStorage"
    );

    return state;

  } catch (error) {

    console.warn(
      "OFFLINE: localStorage read failed:",
      error
    );

  }

  return null;

}

/* =========================================================
   FORMAT CACHE AGE
========================================================= */

function formatCacheAge(timestamp) {

  if (
    !timestamp ||
    !Number.isFinite(
      Number(timestamp)
    )
  ) {

    return "невідомо";

  }

  const diff =
    Math.max(
      0,
      Date.now() -
      Number(timestamp)
    );

  const seconds =
    Math.floor(
      diff / 1000
    );

  if (seconds < 60) {

    return (
      seconds +
      " сек. тому"
    );

  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  if (minutes < 60) {

    return (
      minutes +
      " хв. тому"
    );

  }

  const hours =
    Math.floor(
      minutes / 60
    );

  if (hours < 24) {

    return (
      hours +
      " год. тому"
    );

  }

  const days =
    Math.floor(
      hours / 24
    );

  return (
    days +
    " дн. тому"
  );

}

/* =========================================================
   RESTORE OFFLINE STATE
========================================================= */

async function restoreOfflineState() {

  const state =
    await loadOfflineState();

  if (!state) {

    return false;

  }

  /*
   * Перевіряємо кожне поле окремо.
   *
   * Це захищає від пошкодженого/неповного кешу.
   */

  if (
    Array.isArray(
      state.sheetObjects
    )
  ) {

    sheetObjects =
      state.sheetObjects;

  }

  if (
    Array.isArray(
      state.neptunThreats
    )
  ) {

    neptunThreats =
      state.neptunThreats;

  }

  if (Array.isArray(state.mapaThreats)) {
    mapaThreats = state.mapaThreats;
  }

  if (
    Array.isArray(
      state.neptunAlerts
    )
  ) {

    neptunAlerts =
      state.neptunAlerts;

  }

  if (
    Array.isArray(
      state.neptunAlertOblasts
    )
  ) {

    neptunAlertOblasts =
      state.neptunAlertOblasts;

  }

  if (
    state.raionsGeoJSON &&
    typeof state.raionsGeoJSON ===
      "object"
  ) {

    raionsGeoJSON =
      state.raionsGeoJSON;

  }

  if (
    state.oblastsGeoJSON &&
    typeof state.oblastsGeoJSON ===
      "object"
  ) {

    oblastsGeoJSON =
      state.oblastsGeoJSON;

  }

  offlineCacheSavedAt =
    Number(state.savedAt) || 0;

  offlineCacheLoaded = true;

  /*
   * Спочатку відновлюємо кешовану карту.
   */

  renderNahrThreats();

  renderNeptunThreats();

  updateCategoryCounts();

  updateStatus();

  console.log(

  );

  return true;

}

const panel =

function openPanel() {

  if (!panel) {
    return;
  }

  panel.classList.add(
    "panel-open"
  );

  if (panelToggle) {

    panelToggle.textContent =
      "✕";

  }

function closePanel() {

  if (!panel) {
    return;
  }

  panel.classList.remove(
    "panel-open"
  );

  if (panelToggle) {

    panelToggle.textContent =
      "☰";

  }

function togglePanel() {

  if (!panel) {
    return;
  }

  if (
    panel.classList.contains(
      "panel-open"
    )
  ) {

    closePanel();

  } else {

    openPanel();

  }

}

if (panelToggle) {

  panelToggle.addEventListener(
    "click",
    togglePanel
  );

}

if (panelClose) {

  panelClose.addEventListener(
    "click",
    closePanel
  );

function createCategoryPanel() {

    document.getElementById(
      "categories"
    );

  Object.entries(categories).forEach(
    ([id, category]) => {

      const row =
        document.createElement(
          "label"
        );

        "category";

      const checkbox =
        document.createElement(
          "input"
        );

      checkbox.type =

      checkbox.checked =

      checkbox.dataset.category =

      checkbox.addEventListener(
        "change",

      );

/* =========================================================
   NEPTUN UAV ICON
========================================================= */

function createNeptunThreatIcon(
  type,
  rotate = 0
) {

  const normalizedType =
    normalizeType(type);

  let iconFile = "all.png";
  let shouldRotate = true;

  if (normalizedType === "fpv") {
    iconFile = "fpv.png";
    // FPV marker is always shown without rotation.
    shouldRotate = false;
  }
  else if (normalizedType === "recon") {
    iconFile = "recon.png";
  }
  else if (normalizedType === "uav") {
    iconFile = "uav.png";
  }

  const rotation =
    shouldRotate && rotate != null
      ? rotate
      : 0;

  return L.divIcon({

    className: normalizedType === "all" ?"neptun-threat-icon red": "neptun-threat-icon",

    html: `\n      <div
        class="neptun-threat-marker${iconFile === "all.png" ?" redLevel":
        ""}"
        style="transform: rotate(${rotation}deg);"
      >
        <img
          src="./icon/${iconFile}"
          alt=""
          draggable="false"
          style="width:46px;height:46px;object-fit:contain;display:block;"
          onerror="this.onerror=null;this.src='./icon/.png';"
        >
      </div>
    `,

    iconSize: [38, 38],

    iconAnchor: [19, 19]

  });

}

function getMapaThreatKind(threat) {
  return normalizeType(
    threat?.kind ||
    threat?.subkind ||
    threat?.type
  );
}

function getMapaThreatTitle(threat) {
  const kind = getMapaThreatKind(threat);

  const titles = {
    drone_piston: "БпЛА Shahed / поршневий",
    drone_jet: "БпЛА реактивний",
    missile_cruise: "Крилата ракета",
    missile_ballistic: "Балістична ракета",
    bomb_glide: "Керована авіабомба",
    bomb: "Авіабомба"
  };

  if (titles[kind]) {
    return titles[kind];
  }

  if (threat?.title) {
    return String(threat.title);
  }

  if (threat?.kind) {
    return String(threat.kind);
  }

  return "Повітряна загроза";
}

function getMapaThreatIconFile(threat) {
  const kind = getMapaThreatKind(threat);

  if (
    kind === "drone_piston" ||
    kind === "drone_jet" ||
    kind === "uav" ||
    kind === "drone"
  ) {
    return "uav.png";
  }
  if(kind === "drone_fpv")
    return "fpv.png"

  return "all.png";
}

function createMapaThreatIcon(threat, rotate = 0) {
  const kind = getMapaThreatKind(threat);
  const iconFile =
    getMapaThreatIconFile(threat);

  const rotation =
    Number.isFinite(Number(rotate))

  return L.divIcon({
    className: kind === "drone_jet" ? "neptun-threat-icon redLevel": "neptun-threat-icon",

    html: `
      <div
        class="neptun-threat-marker${kind === "drone_jet" || iconFile ==="all.png" ?" redLevel":
        ""}"
        ${kind !== "drone_fpv"? `style=\"transform: rotate(${rotation}deg);\"` : ""}

        <img

  });

function rememberMapaThreatPopup() {
  let key = null;

  mapaThreatLayerGroup.eachLayer(
    layer => {

      if (
        !key &&
        typeof layer.isPopupOpen === "function" &&
        layer.isPopupOpen()
      ) {
        key =
          layer._threatPopupKey ??
          null;
      }

    }
  );

  return key;
}

function restoreMapaThreatPopup(key) {
  if (!key) {
    return;
  }

  mapaThreatLayerGroup.eachLayer(
    layer => {

      if (
        layer._threatPopupKey === key &&
        typeof layer.openPopup === "function"
      ) {
        layer.openPopup();
      }

    }
  );
}

async function loadMapaThreats() {

  try {

    const response =
      await fetch(
        getMapaThreatsURL(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " +
        response.status
      );
    }

    const data =
      await response.json();

    const objects =
      Array.isArray(data?.objects)
        ? data.objects
        : [];

    mapaThreats =
      objects.filter(
        threat =>
          threat &&
          String(
            threat.status || ""
          ).toLowerCase() === "active" &&
          Number.isFinite(
            Number(threat.lat)
          ) &&
          Number.isFinite(
            Number(
              threat.lon ??
              threat.lng
            )
          )
      );

    renderMapaThreats();

    updateCategoryCounts();
    updateStatus();

    await saveOfflineState();

    console.log(
      "MAPA.UA:",
      mapaThreats
    );

  } catch (error) {

    console.error(
      "MAPA.UA threats:",
      error
    );

    updateStatus();

  }

}

========================================================= */

function updateVisibility() {

  /*
   * Google Sheets
   */

  sheetLayerGroup.eachLayer(
    layer => {

      const category =
        layer._category;

      if (
        visibleCategories[
          category
        ]
      ) {

        if (
          !map.hasLayer(layer)
        ) {

          map.addLayer(
            layer

        }

      } else {

        if (
          map.hasLayer(layer)
        ) {

          map.removeLayer(
            layer
          );

        }

      }

    }
  );

  /*
   * MAPA UAV / threats
   */
  if (visibleCategories[MAPA_CATEGORY_THREAT]) {
    if (!map.hasLayer(mapaThreatLayerGroup)) map.addLayer(mapaThreatLayerGroup);
  } else {
    if (map.hasLayer(mapaThreatLayerGroup)) map.removeLayer(mapaThreatLayerGroup);
  }

  /*
   * NEPTUN UAV / threats
   */

  if (
    visibleCategories[
      NEPTUN_CATEGORY_UAV
    ]
  ) {

    if (
      !map.hasLayer(
        neptunThreatLayerGroup
      )
    ) {

      map.addLayer(
        neptunThreatLayerGroup
      );

    }

  } else {

    if (
      map.hasLayer(
        neptunThreatLayerGroup
      )
    ) {

      map.removeLayer(
        neptunThreatLayerGroup
      );

    }

  }

  /*
   * NEPTUN alerts = CATEGORY 1
   */

  if (
    visibleCategories[
      NEPTUN_CATEGORY_ALERT
    ]
  ) {

    if (
      !map.hasLayer(
        neptunRaionLayerGroup
      )
    ) {

      map.addLayer(
        neptunRaionLayerGroup
      );

    }

    if (
      !map.hasLayer(
        neptunOblastLayerGroup
      )
    ) {

      map.addLayer(
        neptunOblastLayerGroup
      );

    }

  } else {

    if (
      map.hasLayer(
        neptunRaionLayerGroup
      )
    ) {

      map.removeLayer(
        neptunRaionLayerGroup
      );

    }

    if (
      map.hasLayer(
        neptunOblastLayerGroup
      )
    ) {

      map.removeLayer(
        neptunOblastLayerGroup
      );

    }

  }

  updateCategoryCounts();

}

/* =========================================================
   CATEGORY COUNTS
========================================================= */

function updateCategoryCounts() {

  const counts = {};

  Object.keys(categories).forEach(
    id =>
      counts[id] = 0
  );

  /*
   * Google Sheets
   */

  sheetObjects.forEach(
    obj => {

      const type =
        getSheetCategory(
          obj
        );

      if (
        counts[type] !==
        undefined
      ) {

        counts[type]++;

      }

    }
  );

  /*
   * NEPTUN UAV
   */

  neptunThreats.forEach(
    threat => {

      const category =
        getNeptunThreatCategory(
          threat
        );

      if (
        counts[category] !==
        undefined
      ) {

        counts[category]++;

      }

    }
  );

  /*
   * MAPA UAV
   */
  mapaThreats.forEach(() => {
    if (counts[MAPA_CATEGORY_THREAT] !== undefined) counts[MAPA_CATEGORY_THREAT]++;
  });

  /*
   * NEPTUN air alerts
   *
   * район + область считаються
   * частиною категорії 1.
   */

  counts["1"] +=
    neptunAlerts.length;

  counts["1"] +=
    neptunAlertOblasts.length;

  Object.keys(categories).forEach(
    id => {

      const element =
        document.getElementById(
          "count-" + id
        );

      if (element) {

        element.textContent =
          counts[id];

      }

    }
  );

}

/* =========================================================
   NORMALIZE NAME
========================================================= */

function normalizeName(value) {

  return String(
    value || ""
  )
    .toLowerCase()
    .replaceAll(
      "’",
      "'"
    )
    .replaceAll(
      "`",
      "'"
    )
    .replace(
      /область$/u,
      ""
    )
    .replace(
      /район$/u,
      ""
    )
    .replace(
      /області$/u,
      ""
    )
    .replace(
      /району$/u,
      ""
    )
    .replace(
      /[^а-яіїєґa-z0-9]/giu,
      ""
    );

}

/* =========================================================
   GET ALL GEOJSON PROPERTY NAMES
========================================================= */

function getFeatureNames(
  feature
) {

  const props =
    feature?.properties ||
    {};

  const values = [];

  Object.keys(props).forEach(
    key => {

      const value =
        props[key];

      if (
        typeof value ===
        "string"
      ) {

        values.push(
          value
        );

      }

    }
  );

  return values;

}

/* =========================================================
   GEOJSON FEATURE MATCH
========================================================= */

function featureMatchesAlert(
  feature,
  alert
) {

  const alertName =
    normalizeName(
      alert?.name
    );

  if (!alertName) {

    return false;

  }

  return getFeatureNames(
    feature
  ).some(
    name =>
      normalizeName(
        name
      ) ===
      alertName
  );

}

/* =========================================================
   FIND RAION ALERT
========================================================= */

function findRaionAlert(
  feature
) {

  return (
    neptunAlerts.find(
      alert =>
        featureMatchesAlert(
          feature,
          alert
        )
    ) ||
    null
  );

}

/* =========================================================
   FIND OBLAST ALERT
========================================================= */

function findOblastAlert(
  feature
) {

  return (
    neptunAlertOblasts.find(
      alert =>
        featureMatchesAlert(
          feature,
          alert
        )
    ) ||
    null
  );

}

/* =========================================================
   ALERT STYLE
========================================================= */

function getAlertStyle(
  alert,
  isOblast
) {
  const level = String(alert?.level || "red").toLowerCase();
  const isYellow = level === "yellow" || level === "amber";
  const color = isYellow ? "#f5b82e" : "#ff3448";

  // Чёткие административные контуры без тяжёлой заливки,
  // из-за которой соседние полигоны выглядят как один кривой блок.
  return {
    color: isYellow ? "#ffd166" : "#ff5a68",
    weight: isOblast ? 2.4 : 1.25,
    opacity: isOblast ? 0.98 : 0.92,
    lineCap: "round",
    lineJoin: "round",
    fillColor: color,
    fillOpacity: isOblast ? 0.10 : 0.34,
    smoothFactor: 0.35,
    interactive: false
  };
}

function geoNameToSlug(value) {
  const transliteration = {
    "а":"a","б":"b","в":"v","г":"h","ґ":"g","д":"d","е":"e","є":"ye",
    "ж":"zh","з":"z","и":"y","і":"i","ї":"yi","й":"y","к":"k","л":"l",
    "м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f",
    "х":"kh","ц":"ts","ч":"ch","ш":"sh","щ":"shch","ь":"","ю":"yu","я":"ya",
    "ы":"y","э":"e","ё":"yo","'":"","ʼ":"","’":"","`":""
  };
  return String(value || "")
    .toLowerCase()
    .split("")
    .map(ch => transliteration[ch] !== undefined ? transliteration[ch] : ch)
    .join("")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/_+/g, "_")
    .replace(/^_|_$/g, "");
}

async function fetchGeoJSON(url) {
  const response = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), {
    cache: "no-store"
  });
  if (!response.ok) throw new Error("GeoJSON HTTP " + response.status + ": " + url);
  const data = await response.json();
  if (!data || typeof data !== "object" || !Array.isArray(data.features)) {
    throw new Error("Некоректний GeoJSON: " + url);
  }
  return data;
}

async function loadNeptunGeoJSON() {
  try {
    // Сначала загружаем настоящие контуры областей Украины.
    const newOblastsGeoJSON = await fetchGeoJSON(OBLASTS_GEOJSON_URL);

    // Затем — отдельные наборы районов каждой области. Это заменяет старый
    // общий файл с несовпадающими/устаревшими геометриями.
    const oblastFeatures = newOblastsGeoJSON.features;
    const districtResults = await Promise.allSettled(
      oblastFeatures.map(async feature => {
        const props = feature?.properties || {};
        const name = typeof props.name === "string"
          ? props.name
          : (typeof props.NAME_1 === "string" ? props.NAME_1 : "");
        if (!name) return [];
        const slug = geoNameToSlug(name);
        if (!slug) return [];
        const districtGeoJSON = await fetchGeoJSON(GEOJSON_BASE_URL + "/" + slug + ".geojson");
        return districtGeoJSON.features || [];
      })
    );

    const allDistrictFeatures = [];
    let successfulRegionFiles = 0;
    districtResults.forEach(result => {
      if (result.status === "fulfilled") {
        successfulRegionFiles++;
        allDistrictFeatures.push(...result.value);
      } else {
        console.warn("Не вдалося завантажити GeoJSON районів області:", result.reason);
      }
    });

    if (!newOblastsGeoJSON.features.length) {
      throw new Error("GeoJSON областей не містить об’єктів");
    }
    if (successfulRegionFiles === 0 || allDistrictFeatures.length === 0) {
      throw new Error("Не вдалося завантажити GeoJSON районів жодної області");
    }

    raionsGeoJSON = {
      type: "FeatureCollection",
      features: allDistrictFeatures
    };
    oblastsGeoJSON = newOblastsGeoJSON;

    // Окремо підсвічуємо межу АР Крим та Севастополя незалежно від наявності тривоги.
    // Шар містить лише контури, тому не перекриває кольори актуальних тривог.
    if (window.crimeaOutlineLayer) {
      window.crimeaOutlineLayer.clearLayers();
    } else {
      window.crimeaOutlineLayer = L.layerGroup().addTo(map);
    }
    const isCrimeaOrSevastopol = feature => {
      const p = feature && feature.properties ? feature.properties : {};
      const n = String(p.name || p.NAME_1 || p.NAME || p.admin1Name || p.shapeName || "").toLowerCase();
      return n.includes("крим") || n.includes("crimea") || n.includes("sevastopol") || n.includes("севастоп") || n.includes("севастополь");
    };
    newOblastsGeoJSON.features.filter(isCrimeaOrSevastopol).forEach(feature => {
      L.geoJSON(feature, {
        interactive: false,
        style: { color: "#65c7ff", weight: 2.8, opacity: 1, fillOpacity: 0 }
      }).addTo(window.crimeaOutlineLayer);
    });

    console.log("GeoJSON областей завантажено:", oblastsGeoJSON.features.length);
    console.log("GeoJSON районов загружено:", raionsGeoJSON.features.length,
      "из", successfulRegionFiles, "файлов областей");

    renderAlertZones();
    await saveOfflineState();
    updateStatus();
  } catch (error) {
    console.error("GeoJSON NEPTUN:", error);
    // Если новая геометрия не загрузилась, оставляем ранее сохранённый кеш.
    renderAlertZones();
    updateStatus();
  }
}

let customThreats = [];

const mapHistoryDialog = document.getElementById("mapHistory");

function safeThreatText(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}
function threatLevelInfo(level) {
  const n = Number(level);
  if (Number.isFinite(n)) {
    if (n >= 5) return {kind:"red", label:"Червоний рівень"};
    if (n >= 3) return {kind:"yellow", label:"Жовтий рівень"};
    return {kind:"neutral", label:"Інший статус"};
  }
  const value = String(level || "").toLowerCase();
  if (/red|червон/.test(value)) return {kind:"red", label:"Червоний рівень"};
  if (/yellow|amber|жовт/.test(value)) return {kind:"yellow", label:"Жовтий рівень"};
  return {kind:"neutral", label:value ? "Рівень: " + String(level) : "Рівень не вказано"};
}
function normalizeAreaName(value) {
  return normalizeName(String(value || "")
    .replace(/\b(область|обл\.|район|районі)\b/gi, "")
    .replace(/[^а-яіїєґa-z0-9]/gi, ""));
}
function threatsForOblast(oblastName) {
  const needle = normalizeAreaName(oblastName);
  return customThreats.filter(item => {
    const target = normalizeAreaName(item.oblast || item.name || "");
    return target && (target === needle || target.includes(needle) || needle.includes(target));
  });
}
function formatThreatSince(value) {
  if (!value || value === "-") return "Час початку не вказано";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return safeThreatText(value);
  return date.toLocaleString("uk-UA", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
}
function showAreaHistory(name) {
  mapHistoryTitle.textContent = name;
  const items = threatsForOblast(name);

          '<span class="mapHistoryCard__region">Область: ' + oblast + '</span>' +

          '</div></div><span class="mapHistoryCard__ongoing">Активно в списку</span></div>' +
          '<div class="mapHistoryCard__reason">Причина: ' + reason + '</div>' +

      }).join("") + '</section><p class="history-hint">Оновлено: ' +

      '. Рівень 3–4 — жовтий, рівень 5 і вище — червоний.</p>';
  }
  if (!mapHistoryDialog.open) mapHistoryDialog.showModal();

function attachAreaHistory(layer, feature) {
  const props = feature?.properties || {};
  const name = String(props.name || props.NAME_1 || props.shapeName || props.admin1Name || props.NAME || "Область");
  // Відкривати загрози лише для областей, не для районів.
  layer.eachLayer?.(part => {
    if (part.setStyle) part.setStyle({interactive:true, fillOpacity:0.025, opacity:0.8, weight:1.3, color:"#8da8c0"});
    part.on?.("click", event => {
      if (event.originalEvent) L.DomEvent.stopPropagation(event.originalEvent);
      showAreaHistory(name);
    });
    part.on?.("mouseover", () => part.setStyle?.({weight:2.2, color:"#75baff", fillOpacity:0.09}));
    part.on?.("mouseout", () => part.setStyle?.({weight:1.3, color:"#8da8c0", fillOpacity:0.025}));
  });
}
async function loadCustomThreats() {
  try {
    const response = await fetch(CUSTOM_THREATS_URL + "?t=" + Date.now(), {cache:"no-store"});
    if (!response.ok) throw new Error("alarm.json HTTP " + response.status);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("alarm.json має бути масивом");
    customThreats = data.filter(item => item && typeof item === "object" && (item.name || item.oblast));
    customThreatsUpdatedAt = Date.now();
    try { localStorage.setItem(CUSTOM_THREATS_CACHE_KEY, JSON.stringify({updatedAt:customThreatsUpdatedAt, items:customThreats})); } catch (_) {}
    if (mapHistoryDialog.open) showAreaHistory(mapHistoryTitle.textContent);
    console.log("AirThreatMap custom threats:", customThreats.length);
  } catch (error) {
    console.warn("Не вдалося завантажити кастомні загрози:", error);
    if (!customThreats.length) {
      try {
        const cached = JSON.parse(localStorage.getItem(CUSTOM_THREATS_CACHE_KEY) || "null");
        if (Array.isArray(cached?.items)) {
          customThreats = cached.items;
          customThreatsUpdatedAt = Number(cached.updatedAt) || 0;
        }
      } catch (_) {}
    }
  }
}

function renderAlertZones() {

  neptunRaionLayerGroup.clearLayers();

  neptunOblastLayerGroup.clearLayers();

  /*
   * =================================
   * OBLASTS FIRST
   * =================================
   *
   * Області малюємо першими,
   * щоб райони були зверху.
   */

  if (
    oblastsGeoJSON &&
    Array.isArray(
      oblastsGeoJSON.features
    )
  ) {

    oblastsGeoJSON.features.forEach(
      feature => {

        const alert =
          findOblastAlert(
            feature
          );

        if (!alert) {

          return;

        }

        const layer =
          L.geoJSON(
            feature,
            {

              style:
                getAlertStyle(
                  alert,
                  true
                ),

              interactive:
                false

            }
          );

        /*
         * КЛЮЧОВЕ:
         *
         * NEPTUN область =
         * категорія 1
         */

        layer._category =
          NEPTUN_CATEGORY_ALERT;

        layer._neptunAlert =
          true;

        layer._neptunOblast =
          true;

        layer.bindTooltip(
          `
          🚨
          ${alert.name}

          <br>

          Рівень:
          ${alert.level || "невідомий"}
          `,
          {
            sticky: true
          }
        );

        layer.addTo(
          neptunOblastLayerGroup
        );

      }
    );

  }

  /*
   * =================================
   * RAIONS
   * =================================
   */

  if (
    raionsGeoJSON &&
    Array.isArray(
      raionsGeoJSON.features
    )
  ) {

    raionsGeoJSON.features.forEach(
      feature => {

        const alert =
          findRaionAlert(
            feature
          );

        if (!alert) {

          return;

        }

        const layer =
          L.geoJSON(
            feature,
            {

              style:
                getAlertStyle(
                  alert,
                  false
                ),

              interactive:
                false

            }
          );

        /*
         * КЛЮЧОВЕ:
         *
         * NEPTUN район =
         * категорія 1
         */

        layer._category =
          NEPTUN_CATEGORY_ALERT;

        layer._neptunAlert =
          true;

        layer._neptunRaion =
          true;

        layer.bindTooltip(
          `
          🚨
          ${alert.name}

          <br>

          Рівень:
          ${alert.level || "невідомий"}
          `,
          {
            sticky: true
          }
        );

        layer.addTo(
          neptunRaionLayerGroup
        );

      }
    );

  }

  // Build clickable area overlays only when GeoJSON changes; avoid rebuilding
  // hundreds of polygons on every live alert refresh.
  if (window.areaHistoryGeoRef?.oblasts !== oblastsGeoJSON ||
      window.areaHistoryGeoRef?.raions !== raionsGeoJSON) {
    if (window.areaHistoryHitLayer) window.areaHistoryHitLayer.clearLayers();
    else window.areaHistoryHitLayer = L.layerGroup().addTo(map);
    const hitLayer = window.areaHistoryHitLayer;
    [oblastsGeoJSON].forEach(collection => {
      if (!collection || !Array.isArray(collection.features)) return;
      collection.features.forEach(feature => {
        const hit = L.geoJSON(feature, {style:{color:"#8da8c0",weight:1.1,opacity:0.55,fillColor:"#8da8c0",fillOpacity:0.001},interactive:true});
        attachAreaHistory(hit, feature);
        hit.addTo(hitLayer);
      });
    });
    window.areaHistoryGeoRef = {oblasts:oblastsGeoJSON, raions:raionsGeoJSON};
  }
  rememberAlertSnapshot();
  updateVisibility();

}

/* =========================================================
   GET THREAT CATEGORY
========================================================= */

function getNeptunThreatCategory(
  threat
) {

  const type =
    normalizeType(
      threat?.type
    );

  /*
   * ШАХЕД / БПЛА
   *
   * ВСЕ UAV -> КАТЕГОРІЯ 2
   */

  if (
    type === "uav"
  ) {

    return NEPTUN_CATEGORY_UAV;

  }

  /*
   * Інші повітряні загрози
   * також відносимо до авіації.
   */

  if (
    type === "missile" ||
    type === "rocket" ||
    type === "aircraft" ||
    type === "plane"
  ) {

    return NEPTUN_CATEGORY_UAV;

  }

  return NEPTUN_CATEGORY_UAV;

}

/* =========================================================
   THREAT POSITION
========================================================= */

function getThreatPosition(
  threat
) {

  /*
   * НЕПТУН SDK prediction
   */

  try {

    if (
      window.NEPTUN &&
      typeof NEPTUN.predict ===
        "function"
    ) {

      const predicted =
        NEPTUN.predict(
          threat,
          Date.now()
        );

      if (
        predicted &&
        Number.isFinite(
          Number(
            predicted.lat
          )
        ) &&
        Number.isFinite(
          Number(
            predicted.lon
          )
        )
      ) {

        return [
          Number(
            predicted.lat
          ),
          Number(
            predicted.lon
          )
        ];

      }

    }

  } catch (error) {

    console.warn(
      "NEPTUN predict error:",
      error
    );

  }

  /*
   * Fallback
   */

  if (
    Number.isFinite(
      Number(
        threat?.lat
      )
    ) &&
    Number.isFinite(
      Number(
        threat?.lon
      )
    )
  ) {

    return [
      Number(
        threat.lat
      ),
      Number(
        threat.lon
      )
    ];

  }

  return null;

}


/* =========================================================
   THREAT TITLE
========================================================= */

function getThreatTitle(
  threat
) {

  const type =
    normalizeType(
      threat?.type
    );

  if (
    type === "uav"
  ) {

    return "Тип : БпЛА";

  }

  if (
    threat?.title
  ) {

    return "Тип : "+ String(
      threat.title
    );

  }

  if (
    threat?.name
  ) {

    return String(
      threat.name
    );

  }

  return "Тип : Невідомо";

}

/* =========================================================
   KEEP OPEN THREAT POPUP DURING NEPTUN/Nahr RERENDER
========================================================= */
function getThreatPopupKey(threat) {
  if (!threat) return null;
  const id = threat.id ?? threat.uuid ?? threat._id ?? threat.threatId ?? threat.threat_id;
  if (id != null && String(id).trim() !== "") return "id:" + String(id);
  const position = getThreatPosition(threat);
  return [
    "fallback",
    position ? Number(position[0]).toFixed(6) : "",
    position ? Number(position[1]).toFixed(6) : "",
    normalizeType(threat.type),
    threat.title ?? threat.name ?? "",
    threat.locality ?? ""
  ].join("|");
}

function rememberOpenThreatPopup() {
  let key = null;
  neptunThreatLayerGroup.eachLayer(layer => {
    if (!key && typeof layer.isPopupOpen === "function" && layer.isPopupOpen()) {
      key = layer._threatPopupKey ?? null;
    }
  });
  return key;
}

function restoreOpenThreatPopup(key) {
  if (!key) return;
  neptunThreatLayerGroup.eachLayer(layer => {
    if (layer._threatPopupKey === key && typeof layer.openPopup === "function") {
      layer.openPopup();
    }
  });
}

/* =========================================================
   LOAD NEPTUN ALERTS REST
========================================================= */

async function loadNeptunAlerts() {

  try {

    const response =
      await fetch(
        NEPTUN_ALERTS_URL +
        "?t=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const data =
      await response.json();
    
    const daaa= await data
    console.log(
      daaa
    );
    /*
     * API має повернути обидва масиви.
     *
     * Якщо структура зовсім інша,
     * не перезаписуємо поточні дані.
     */

    if (
      !Array.isArray(
        data?.raions
      ) ||
      !Array.isArray(
        data?.oblasts
      )
    ) {

      throw new Error(
        "NEPTUN alerts повернув некоректну структуру"
      );

    }
    

    /*
     * Райони
     */

    neptunAlerts =
      data.raions;

    /*
     * Області
     */

    neptunAlertOblasts =
      data.oblasts;
    
    console.log(
      "NEPTUN райони:",
      neptunAlerts
    );
    

    console.log(
      "NEPTUN області:",
      neptunAlertOblasts
    );

    renderAlertZones();

    updateAlertBadge();

    updateCategoryCounts();

    updateStatus();

    /*
     * Зберігаємо тільки після
     * успішної валідної відповіді.
     */

    await saveOfflineState();

  } catch (error) {

    console.error(
      "NEPTUN alerts:",
      error
    );

    /*
     * Не очищаємо старі дані.
     */

    updateStatus();

  }

}

/* =========================================================
   LOAD NEPTUN THREATS REST
========================================================= */

async function loadNeptunThreats() {

  try {

    const response =
      await fetch(
        NEPTUN_THREATS_URL +
        "?t=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    /*
     * API може повернути:
     *
     * масив
     *
     * або
     *
     * { threats: [] }
     */

    let newThreats = null;

    if (
      Array.isArray(data)
    ) {

      newThreats =
        data;

    } else if (
      Array.isArray(
        data?.threats
      )
    ) {

      newThreats =
        data.threats;

    } else {

      throw new Error(
        "NEPTUN threats повернув некоректну структуру"
      );

    }

    /*
     * Тільки валідний масив
     * замінює поточні дані.
     */

    neptunThreats =
      newThreats;

    renderNeptunThreats();

    updateCategoryCounts();
    console.log(
      "NEPTUN:",
      data
    );
    updateStatus();

    /*
     * Зберігаємо актуальні загрози.
     */

    await saveOfflineState();

  } catch (error) {

    console.error(
      "NEPTUN threats:",
      error
    );

    /*
     * Старі загрози залишаються.
     */

    updateStatus();

  }

}

/* =========================================================
   ALERT BADGE
========================================================= */

function updateAlertBadge() {

  const badge =
    document.getElementById(
      "alertBadge"
    );

  /*
   * alertBadge зараз закоментований.
   *
   * Якщо його немає — просто виходимо.
   */

  if (!badge) {

    return;

  }

  const hasAlerts =
    neptunAlerts.length > 0 ||
    neptunAlertOblasts.length > 0;

  if (hasAlerts) {

    badge.style.display =
      "block";

  } else {

    badge.style.display =
      "none";

  }

}

/* =========================================================
   STATUS
========================================================= */

function updateStatus() {

  const status =
    document.getElementById(
      "status"
    );

  if (!status) {
    return;
  }

  const alerts =
    neptunAlerts.length +
    neptunAlertOblasts.length;

  const uavs =
    neptunThreats.filter(
      threat =>
        getNeptunThreatCategory(
          threat
        ) ===
        NEPTUN_CATEGORY_UAV
    ).length;

  const news =
    sheetObjects.filter(
      obj =>
        getSheetCategory(
          obj
        ) === "13"
    ).length;

  /*
   * Кеш показуємо ЗАВЖДИ.
   */
  let cacheText =
    "перевірка...";

  if (offlineCacheLoaded) {

    cacheText =
      offlineCacheSavedAt
        ? formatCacheAge(
            offlineCacheSavedAt
          )
        : "збережено";

  } else if (
    !navigator.onLine
  ) {

    cacheText =
      "даних немає";

  } else {

    cacheText =
      "порожній";

  }

  const networkText =
    navigator.onLine
      ? "🟢 ОНЛАЙН"
      : "🔴 ОФЛАЙН";

  const cacheMode =
    offlineCacheLoaded
      ? (
          navigator.onLine
            ? "збережені дані доступні"
            : "показано збережені дані"
        )
      : (
          navigator.onLine
            ? "кеш ще не завантажено"
            : "збережених даних немає"
        );

  status.innerHTML =
    `
    ${networkText}

    <br>
    ${cacheMode}

    <br>
    Кеш:
    ${cacheText}

    <br><br>

    Google Sheets:
    ${sheetObjects.length}

    <br>

    📰 Новин:
    ${news}

    <br>

    NEPTUN тривог:
    ${alerts}

    <br>

    NEPTUN БпЛА:
    ${uavs}
    `;

}

/* =========================================================
   NEPTUN REALTIME
========================================================= */

let neptunRealtimeClient =
  null;

function startNeptunRealtime() {

  try {

    if (
      !window.NEPTUN ||
      typeof NEPTUN.RealtimeClient !==
        "function"
    ) {

      console.warn(
        "NEPTUN RealtimeClient недоступний"
      );

      return;

    }

    neptunRealtimeClient =
      new NEPTUN.RealtimeClient(
        NEPTUN_URL
      );

    neptunRealtimeClient.subscribe(
      snapshot => {

        console.log(
          "NEPTUN realtime snapshot:",
          snapshot
        );

        /*
         * Прапорець:
         *
         * чи отримали ми хоча б
         * одне валідне поле.
         */

        let changed =
          false;

        /*
         * Загрози
         */

        if (
          Array.isArray(
            snapshot?.threats
          )
        ) {

          neptunThreats =
            snapshot.threats;

          changed = true;

          renderNeptunThreats();

        }

        /*
         * Районні тривоги
         *
         * КАТЕГОРІЯ 1
         */

        if (
          Array.isArray(
            snapshot?.alerts
          )
        ) {

          neptunAlerts =
            snapshot.alerts;

          changed = true;

        }

        /*
         * Обласні тривоги
         *
         * КАТЕГОРІЯ 1
         */

        if (
          Array.isArray(
            snapshot?.alertOblasts
          )
        ) {

          neptunAlertOblasts =
            snapshot.alertOblasts;

          changed = true;

        }

        /*
         * Якщо snapshot містив хоча б
         * одне валідне поле — перемальовуємо
         * та зберігаємо.
         */

        if (changed) {

          renderAlertZones();

          updateAlertBadge();

          updateCategoryCounts();

          updateStatus();

          /*
           * ВАЖЛИВО:
           *
           * realtime snapshot може не містити
           * GeoJSON, тому saveOfflineState()
           * бере вже наявний GeoJSON і не
           * затирає його null-ом.
           */

          saveOfflineState();

        }

      }
    );

    neptunRealtimeClient.start();

    console.log(
      "NEPTUN realtime запущено"
    );

  } catch (error) {

    console.error(
      "NEPTUN realtime:",
      error
    );

  }

}

========================================================= */

async function init() {

  createCategoryPanel();

  /*
   * =======================================================
   * ПЕРШИЙ КРОК:
   * ВІДНОВЛЕННЯ INDEXEDDB
   * =======================================================
   *
   * Це спеціально виконується ПЕРЕД мережевими запитами.
   *
   * Якщо користувач відкрив карту офлайн,
   * тут одразу з'являться старі маркери,
   * тривоги та GeoJSON.
   */

  try {

    await restoreOfflineState();

  } catch (error) {

    console.warn(
      "OFFLINE restore:",
      error
    );

  }

  /*
   * Після відновлення кешу карта вже може
   * бути показана користувачу.
   */

  updateVisibility();

  updateStatus();

  /*
   * =======================================================
   * ДАЛІ — МЕРЕЖА
   * =======================================================
   *
   * Не покладаємося тільки на navigator.onLine.
   * На телефонах він інколи каже "online", хоча fetch
   * фактично не працює. Кеш у такому випадку залишається.
   */

  updateStatus();

  const networkLoads = [
    loadNeptunGeoJSON(),
    loadNeptunAlerts(),
    loadNeptunThreats(),
    loadMapaThreats(),
    loadCustomThreats()
  ];

  await Promise.allSettled(
    networkLoads
  );

  /*
   * =======================================================
   * NEPTUN REALTIME
   * =======================================================
   */

  if (
    navigator.onLine
  ) {

    startNeptunRealtime();

  }

  /*
   * =======================================================
   * ПЕРІОДИЧНЕ РЕЗЕРВНЕ ОНОВЛЕННЯ
   * =======================================================
   */

  

  setInterval(
    function() {

      if (
        navigator.onLine
      ) {

        loadNeptunAlerts();

      }

    },
    15000
  );
  
  setInterval(
    function() {

      if (
        navigator.onLine
      ) {

        loadNeptunThreats();

      }

    },
    15000
  );

  setInterval(
    function() {
      if (navigator.onLine) {
        loadMapaThreats();
      }
    },
    15000
  );

  setInterval(function() { if (navigator.onLine) loadCustomThreats(); }, 60000);

  /*
   * Оновлюємо статус кешу періодично,
   * щоб час "N хв. тому" був актуальним.
   */

  setInterval(
    function() {

      updateStatus();

    },
    30000
  );

  updateVisibility();

  updateStatus();

}

/* =========================================================
   START
========================================================= */

init();
